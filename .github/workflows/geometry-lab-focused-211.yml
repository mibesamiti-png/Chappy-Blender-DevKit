name: Geometry Lab focused Phase 211
on:
  pull_request:
    paths:
      - 'research/native_bevel_phase112/phase211_*.py'
      - 'research/native_bevel_phase112/phase210_inverse_cam.py'
      - 'research/native_bevel_phase112/phase210_xy_cam.py'
      - '.github/workflows/geometry-lab-focused-211.yml'
permissions:
  contents: read
concurrency:
  group: geometry-focused-211-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  phase211-focused:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research sources
        run: python -m compileall -q .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned Blender archive
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Reproduce inverse profiles and guarded support design
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/blender-4.4.3-linux-x64/blender"
          "$B" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase210_inverse_cam.py
          "$B" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_support_design.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results")
          a=json.loads((p/"phase210_inverse_cam.json").read_text())
          b=json.loads((p/"phase211_support_design.json").read_text())
          assert a["gate"] and b["static_gate"]
          assert b["selected_duty"]==.77 and b["selected_phases"]==[0,270,180,90]
          PY
      - name: Build and audit stacked cam subassembly
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_cam_pack.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_cam_pack.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert (d["cam_count"],d["roller_count"],d["shaft_count"])==(8,8,1)
          assert d["duty"]==.77 and d["phases"]==[0,270,180,90]
          assert d["pack_gate"]==(all(d["checks"].values()) and all(d["controls"].values()))
          assert not d["transmission_certified"] and not d["whole_machine_com_certified"] and not d["physical_walk_certified"]
          assert len(d["rows"])==721
          assert all(math.isfinite(v) for r in d["rows"] for k in ("com","cam_com") for v in r[k])
          assert (p/"phase211_cam_pack.blend").stat().st_size>0
          print("Cam pack gate (subassembly only):",d["pack_gate"])
          PY
      - name: Evaluate passive return spring under vertical gravity
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_spring_return.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_spring_return.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert d["gravity"]==[0.,-9.81,0.] and d["duty"]==.77
          t=d["trials"]
          assert [r["stiffness"] for r in t]==[3.,10.,30.][:len(t)]
          chosen=next((r["stiffness"] for r in t if r["case"]["passed"]),None)
          assert d["selected_stiffness"]==chosen
          assert chosen is not None or len(t)==3
          controls=d["controls"] or []
          assert [c["name"] for c in controls]==(["separated","motor_off"] if chosen is not None else [])
          n=d["spring_disabled"]
          assert n["spring"]==0.
          assert d["negative_control_detected"]==(not n["checks"]["axis_tracking"] or not n["checks"]["contact"])
          assert d["spring_gate"]==(chosen is not None and all(c["passed"] for c in controls) and d["negative_control_detected"])
          for c in [r["case"] for r in t]+controls+[n]:
              assert c["passed"]==all(c["checks"].values())
              assert len(c["rows"])==601 and c["substeps"]==32
              assert all(math.isfinite(v) for r in c["rows"] for v in r.values())
          assert not d["physical_walk_certified"] and not d["whole_machine_certified"]
          print("Passive return physical gate:",d["spring_gate"])
          PY
      - name: Finish bounded spring stiffness comparison
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_spring_refine.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_spring_refine.json").read_text())
          b=json.loads((p/"phase211_spring_return.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["criteria_changed"] and not d["geometry_changed"] and not d["physical_walk_certified"]
          assert d["prior_gate"]==b["spring_gate"] and d["negative_control_detected"]==b["negative_control_detected"]
          t=d["trials"]
          assert [r["stiffness"] for r in t]==[60.,100.][:len(t)]
          for r in t:
              c=r["cases"]
              assert [v["name"] for v in c]==(["engaged","separated","motor_off"] if c[0]["passed"] else ["engaged"])
              assert r["passed"]==(len(c)==3 and all(v["passed"] for v in c))
              for v in c:
                  assert v["passed"]==all(v["checks"].values()) and len(v["rows"])==601
                  assert v["spring"]==r["stiffness"] and v["substeps"]==32
                  assert all(math.isfinite(x) for row in v["rows"] for x in row.values())
          chosen=b["selected_stiffness"] if b["spring_gate"] else next((r["stiffness"] for r in t if r["passed"]),None)
          assert d["selected_stiffness"]==chosen
          assert (not t if b["spring_gate"] else bool(t) and (chosen is not None or len(t)==2))
          assert d["spring_gate"]==(chosen is not None and d["negative_control_detected"])
          print("Refined passive return physical gate:",d["spring_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase211-focused-${{ github.sha }}
          path: |
            research/native_bevel_phase112/results/phase210_inverse_cam.json
            research/native_bevel_phase112/results/phase211_*
          if-no-files-found: warn
          retention-days: 14

  phase211-preload:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research sources
        run: python -m compileall -q .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned Blender archive
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Evaluate gravity-loaded passive spring anchor
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_spring_preload.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_spring_preload.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["criteria_changed"] and not d["cam_geometry_changed"]
          assert d["initially_relaxed"] and d["gravity_dependent_anchor"] and d["force_proxy_not_measured"]
          assert not d["portable_return_certified"] and not d["physical_walk_certified"]
          assert d["stiffness"]==5. and d["gravity"]==[0.,-9.81,0.] and d["duty"]==.77
          t=d["trials"]
          assert [r["preload"] for r in t]==[0.,1.,2.][:len(t)] and len(t)>=2
          for r in t:
              q=r["audit"];c=r["cases"]
              if r["preload"]:
                  assert q["passed"]==(q["min_settled_anchor_travel"]>=.9*r["preload"] and q["max_guide_error"]<=.02 and q["min_settled_force_proxy"]>=2.)
              else:
                  assert q is None
              assert r["passed"]==bool(q and q["passed"] and len(c)==3 and all(v["passed"] for v in c))
              for v in c:
                  assert v["passed"]==all(v["checks"].values()) and len(v["rows"])==601
                  assert v["preload"]==r["preload"] and v["spring"]==5. and v["substeps"]==32
                  assert all(math.isfinite(x) for row in v["rows"] for x in row.values())
          chosen=next((r["preload"] for r in t if r["passed"]),None)
          assert chosen==d["selected_preload"] and (chosen is not None or len(t)==3)
          assert d["baseline_failed"]==(not t[0]["cases"][0]["passed"])
          assert d["preload_gate"]==(d["baseline_failed"] and chosen is not None)
          print("Gravity-loaded preload fixture gate:",d["preload_gate"])
          PY
      - name: Isolate preload startup with held shaft and delayed drive
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_delayed_start.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_delayed_start.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["criteria_relaxed"] and not d["body_transform_keyframes"]
          assert not d["portable_return_certified"] and not d["physical_walk_certified"]
          assert d["delay_frames"]==120 and d["drive_frames"]==601 and d["motor_hold"]
          assert d["preload"]==1. and d["stiffness"]==5.
          c=d["cases"]
          assert [v["name"] for v in c]==(["engaged","separated","motor_off"] if c[0]["passed"] and d["audit"]["passed"] else ["engaged"])
          for v in c:
              assert v["passed"]==all(v["checks"].values())
              assert v["delay"]==120 and v["spring"]==5. and v["preload"]==1.
              assert [r["frame"] for r in v["rows"]]==list(range(1,722))
              assert all(math.isfinite(x) for row in v["rows"] for x in row.values())
              assert all(k in v["checks"] for k in ("startup_hold","startup_coupling","startup_drift"))
          assert all(k in c[0]["checks"] for k in ("startup_contact","startup_tracking","preload_ready"))
          assert d["delayed_gate"]==(len(c)==3 and all(v["passed"] for v in c) and d["audit"]["passed"])
          assert d["baseline_peaks"] and all(q["peak"]["frame"]>=1 for q in d["baseline_peaks"])
          print("Delayed motor start fixture gate:",d["delayed_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase211-preload-${{ github.sha }}
          path: |
            research/native_bevel_phase112/results/phase211_spring_preload.json
            research/native_bevel_phase112/results/phase211_preload_*
            research/native_bevel_phase112/results/phase211_delayed*
          if-no-files-found: warn
          retention-days: 14

  phase211-groove:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research sources
        run: python -m compileall -q .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned Blender archive
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Evaluate conjugate groove geometry and positive drive
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_groove_drive.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_groove_drive.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["spring"] and d["gravity"]==[0.,-9.81,0.] and d["duty"]==.77
          assert not d["manufacturable_groove_certified"] and not d["physical_walk_certified"]
          assert d["ideal_wall_attachment"] and d["nominal_clearance"]==.006
          assert [q["kind"] for q in d["profiles"]]==["stride","lift"]
          assert d["profile_gate"]==all(q["passed"] for q in d["profiles"])
          for q in d["profiles"]:
              assert q["passed"]==(q["min_gap"]>=.004 and q["max_gap"]<=.008 and q["min_polar_step"]>0.)
          c=d["cases"];n=d["open_wall_control"]
          assert [v["name"] for v in c]==(["engaged","separated","motor_off"] if d["profile_gate"] else [])
          assert bool(n)==d["profile_gate"]
          for v in c+([n] if n else []):
              assert len(v["rows"])==601 and v["passed"]==all(v["checks"].values())
              assert v["spring"]==0. and v["substeps"]==32
              assert all(math.isfinite(x) for row in v["rows"] for x in row.values())
          assert all(v["groove"] for v in c) and (n is None or not n["groove"])
          assert d["open_wall_rejected"]==bool(n and (not n["checks"]["contact"] or not n["checks"]["axis_tracking"]))
          assert d["positive_drive_gate"]==(len(c)==3 and all(v["passed"] for v in c) and d["open_wall_rejected"])
          print("Positive groove drive fixture gate:",d["positive_drive_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase211-groove-${{ github.sha }}
          path: |
            research/native_bevel_phase112/results/phase211_groove_drive.json
            research/native_bevel_phase112/results/phase211_groove*
          if-no-files-found: warn
          retention-days: 14

  phase211-backed:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research sources
        run: python -m compileall -q .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned Blender archive
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Verify connected groove solids and positive drive
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase211_backed_drive.py
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results")
          d=json.loads((p/"phase211_backed_drive.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["independent_wall_constraint"] and not d["manufacturing_certified"] and not d["physical_walk_certified"]
          assert d["ideal_shaft_coupling"] and not d["spring"] and d["duty"]==.77
          assert [q["kind"] for q in d["geometry"]]==["stride","lift"]
          assert d["geometry_gate"]==all(q["passed"] for q in d["geometry"])
          c=d["cases"]
          assert [v["name"] for v in c]==(["engaged","separated","motor_off"] if d["geometry_gate"] else [])
          for v in c:
              assert len(v["rows"])==601 and v["passed"]==all(v["checks"].values())
              assert v["backed"] and v["groove"] and v["spring"]==0.
              assert all(math.isfinite(x) for row in v["rows"] for x in row.values())
              if not v["separated"]:
                  assert v["checks"]["backplate_clearance"]==all(min(r[k+"_back_gap"] for r in v["rows"])>=.02 for k in ("stride","lift"))
              assert (p/"phase211_backed"/("phase210_xy_"+v["name"]+".blend")).stat().st_size>0
          assert d["backed_drive_gate"]==(len(c)==3 and all(v["passed"] for v in c))
          print("Connected groove solid drive gate:",d["backed_drive_gate"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase211-backed-${{ github.sha }}
          path: |
            research/native_bevel_phase112/results/phase211_backed*
          if-no-files-found: warn
          retention-days: 14
