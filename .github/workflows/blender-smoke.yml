name: CBDK Blender multi-version runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'docs/project/STATE.json'
      - 'parts/blender/**'
      - 'cbdk/blender_test.py'
      - 'cbdk/evidence.py'
      - 'cbdk/__main__.py'
      - 'scripts/blender_parts_smoke.py'
      - 'cbdk/addon_builder.py'
      - 'cbdk/modular_builder.py'
      - 'cbdk/feature_catalog.py'
      - 'catalog/addon_features.json'
      - 'recipes/**'
      - 'templates/mesh_inspector/**'
      - 'templates/modular_preview/**'
      - 'scripts/blender_generated_addon_smoke.py'
      - 'scripts/blender_modular_addon_smoke.py'
      - 'scripts/blender_audit_scaling_smoke.py'
      - 'scripts/blender_undo_redo_smoke.py'
      - 'cbdk/undo_probe_report.py'
      - 'cbdk/glb_inspector.py'
      - 'cbdk/glb_render.py'
      - 'tests/test_glb_regression.py'
      - 'tests/test_glb_compare.py'
      - 'cbdk/glb_regression.py'
      - 'cbdk/glb_surface_pipeline.py'
      - 'scripts/blender_glb_surface_review.py'
      - 'tests/test_glb_surface_pipeline.py'
      - 'cbdk/glb_compare.py'
      - 'tests/test_glb_diagnose.py'
      - 'cbdk/glb_diagnose.py'
      - 'cbdk/glb_repair_plan.py'
      - 'cbdk/glb_property_map.py'
      - 'cbdk/glb_property_usage.py'
      - 'tests/test_glb_repair_plan.py'
      - 'tests/test_glb_property_map.py'
      - 'tests/test_glb_property_usage.py'
      - 'scripts/blender_glb_render.py'
      - 'scripts/blender_make_glb_fixture.py'
      - 'scripts/blender_parameter_experiment_smoke.py'
      - 'fixtures/cbdk_parameter_experiment.py'
      - 'tests/test_glb_parameter_experiment.py'
      - 'tests/test_glb_inspector.py'
      - '.github/workflows/blender-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blender-parts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blender-version: ['4.4.3', '4.5.15', '5.2.1']
    timeout-minutes: 25
    env:
      BLENDER_VERSION: ${{ matrix.blender-version }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout (no private input sources)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for CBDK CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless EGL/OpenGL runtime for preview rendering
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Download official Blender Linux binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/${archive}" -o "${archive}"
          grep -F "${archive}" blender.sha256 | sha256sum --check --status
          tar -xJf "${archive}"
          echo "BLENDER_PATH=$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Check Blender is executable
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --version | head -n 3
      - name: Run real Blender parts checks and save evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          python -m cbdk verify-parts --blender "$BLENDER_PATH" --timeout 180 \
            --output reports/ci/parts_evidence.json 2>&1 | tee reports/ci/blender.log
          python -m cbdk evidence-status --evidence reports/ci/parts_evidence.json \
            2>&1 | tee reports/ci/evidence_status.log
          python -m cbdk part-matrix --evidence reports/ci/parts_evidence.json \
            --output reports/ci/parts_matrix.json 2>&1 | tee reports/ci/part_matrix.log
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('reports/ci/parts_evidence.json').read_text())
          assert p['run_status'] == 'passed', p
          assert set(p['parts']) == {'BLCTX-001', 'BLCTX-002', 'BME-001', 'BME-002', 'BME-003', 'BLGEO-001', 'BLMOD-001'}, p
          assert all(x['status'] == 'blender_smoke_passed' for x in p['parts'].values()), p
          with Path('reports/ci/summary.md').open('w', encoding='utf-8') as f:
              f.write('# CBDK Blender runtime test\n\n')
              f.write(f"Blender: **{p['blender_version']}**  \n")
              f.write('Parts passed: **7/7** (smoke only; not approved)\n')
          PY
          cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify authored feature catalog and preview plan for target Blender
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk.recipe_matrix --output reports/ci/recipe_matrix.json \
            2>&1 | tee reports/ci/recipe_matrix.log
          python -m cbdk feature-list --output reports/ci/feature_catalog.json             2>&1 | tee reports/ci/feature_catalog.log
          python -m cbdk addon-plan --recipe recipes/modular_all.json             --target-blender "$BLENDER_VERSION" --output reports/ci/addon_plan.json             2>&1 | tee reports/ci/addon_plan.log
      - name: Build private development-preview addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk build-addon \
            --recipe recipes/mesh_inspector.json \
            --target-blender "$BLENDER_VERSION" \
            --preview-unapproved \
            --output reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/addon_build.log
      - name: Activate generated addon and test operator in real Blender
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_generated_addon_smoke.py \
            -- reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/generated_addon_smoke.log
          grep -F 'CBDK_GENERATED_ADDON_PASS ' reports/ci/generated_addon_smoke.log
          echo "Generated preview add-on: enable, Object/Edit operators, negative case and disable PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Build and test six modular recipe combinations in real Blender
        shell: bash
        run: |
          set -euo pipefail
          for recipe in modular_objects modular_edit modular_combined modular_geometry modular_nudge modular_all; do
            output="reports/ci/CBDK_${recipe}_Preview.zip"
            python -m cbdk build-addon \
              --recipe "recipes/${recipe}.json" \
              --target-blender "$BLENDER_VERSION" \
              --preview-unapproved \
              --output "$output" 2>&1 | tee "reports/ci/${recipe}_build.log"
            "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
              --python scripts/blender_modular_addon_smoke.py \
              -- "$output" 2>&1 | tee "reports/ci/${recipe}_smoke.log"
            grep -F 'CBDK_MODULAR_ADDON_PASS ' "reports/ci/${recipe}_smoke.log"
          done
          echo 'Modular preview variants: objects, edit, combined, geometry, nudge and all PASSED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Probe native Undo and Redo (background only, not GUI hotkeys)
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_undo_redo_smoke.py \
            -- reports/ci/CBDK_modular_nudge_Preview.zip \
            2>&1 | tee reports/ci/undo_redo_smoke.log
          python -m cbdk.undo_probe_report \
            reports/ci/undo_redo_smoke.log reports/ci/undo_redo.json
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Native Undo/Redo was **probed** in background Blender.
          See undo_redo.json: an unavailable poll is **not** counted as passed.
          GUI Ctrl+Z / Ctrl+Shift+Z remains unverified.
          EOF
      - name: Measure guarded audit on medium real Blender mesh
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_audit_scaling_smoke.py \
            2>&1 | tee reports/ci/audit_scaling_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows = Path('reports/ci/audit_scaling_smoke.log').read_text().splitlines()
          matches = [x.split('CBDK_AUDIT_SCALING_PASS ', 1)[1]
                     for x in rows if 'CBDK_AUDIT_SCALING_PASS ' in x]
          assert len(matches) == 1, matches
          data = json.loads(matches[0])
          assert data['postedit_audit_passed'] and data['no_mutation_on_limit']
          Path('reports/ci/audit_scaling.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Real Blender guarded audit scaling and mutation-free over-limit reject PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Experiment with trusted addon property changes and real GLB roundtrip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci/parameter_experiment
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_parameter_experiment_smoke.py \
            -- reports/ci/parameter_experiment \
            2>&1 | tee reports/ci/parameter_experiment.log
          grep -F 'CBDK_PARAMETER_EXPERIMENT_PASS ' reports/ci/parameter_experiment.log
          for variant in baseline sphere_radius_changed bevel_width_changed sphere_probe_up sphere_probe_down bevel_probe_up bevel_probe_down; do
            python -m cbdk glb-inspect "reports/ci/parameter_experiment/${variant}.glb" \
              --output "reports/ci/parameter_experiment/${variant}_structure.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/ci/parameter_experiment')
          result = json.loads((root / 'parameter_experiment.json').read_text())
          assert result['kind'] == 'cbdk_trusted_blender_parameter_experiment', result
          assert result['source_fixture'] == 'cbdk_authored_only', result
          assert len(result['variants']) == 7, result
          assert all(result['controls'].values()), result
          assert all(v is False for v in result['safety'].values()), result
          directions = result['direction_probe_evidence']
          assert set(directions) == {'generated', 'imported'}, result
          for stage in ('generated', 'imported'):
              assert set(directions[stage]) == {'sphere_radius', 'bevel_width'}, result
              for evidence in directions[stage].values():
                  assert evidence['decision'] == 'increase', evidence
                  score = evidence['reference_error']
                  assert score['increase_probe'] < score['baseline'] < score['decrease_probe'], evidence
                  assert all(count == 0 for count in evidence['unrelated_probe_changed_vertices'].values()), evidence
                  assert evidence['suggested_numeric_value'] is None
                  assert evidence['score_metric'] == 'sorted_local_origin_radius_mean_absolute_difference'
                  assert evidence['score_invariant_to_vertex_order'] is True
                  assert evidence['general_geometry_equivalence_verified'] is False
                  assert evidence['auto_apply'] is False
                  assert evidence['verified_for_arbitrary_user_addons'] is False
          evidence = result['quantified_vertex_displacement']
          sphere = 'CBDK_Param_Sphere'
          cube = 'CBDK_Param_BevelCube'
          for stage in ('generated', 'imported'):
              assert evidence[stage]['sphere_radius_changed'][sphere]['max_local_displacement'] > .2
              assert evidence[stage]['sphere_radius_changed'][cube]['changed_vertex_count'] == 0
              assert evidence[stage]['bevel_width_changed'][cube]['max_local_displacement'] > .01
              assert evidence[stage]['bevel_width_changed'][sphere]['changed_vertex_count'] == 0
              assert all(not row['valid_for_arbitrary_glb']
                         for variant in evidence[stage].values()
                         for row in variant.values())
          for variant in ('baseline', 'sphere_radius_changed', 'bevel_width_changed',
                          'sphere_probe_up', 'sphere_probe_down',
                          'bevel_probe_up', 'bevel_probe_down'):
              assert (root / f'{variant}.glb').stat().st_size > 100
              data = json.loads((root / f'{variant}_structure.json').read_text())
              assert data['kind'] == 'cbdk_glb_static_inspection', data
              assert data['counts']['meshes'] == 2, data
          PY
          if [ "$BLENDER_VERSION" = "4.5.15" ]; then
            set +e
            python -m cbdk glb-regression \
              reports/ci/parameter_experiment/baseline.glb \
              reports/ci/parameter_experiment/sphere_radius_changed.glb \
              --blender "$BLENDER_PATH" \
              --output reports/ci/parameter_experiment/radius_regression \
              --resolution 256 --timeout 180 \
              --scene-rel-tol 0.02 --dimension-rel-tol 0.10 --center-rel-tol 0.02 \
              --silhouette-iou-min 0.90 --surface-review
            status=$?
            set -e
            test "$status" -eq 1
            python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/ci/parameter_experiment/radius_regression')
          comparison = json.loads((root / 'comparison.json').read_text())
          diagnosis = json.loads((root / 'diagnosis.json').read_text())
          repair = json.loads((root / 'repair_plan.json').read_text())
          surface = json.loads((root / 'surface_review.json').read_text())
          assert surface['status'] in ('review_only', 'skipped'), surface
          assert surface['complete_surface_equivalence_proven'] is False
          assert surface['auto_apply'] is False
          codes = {x['code'] for x in comparison['differences']
                   if x['severity'] == 'error'}
          assert not comparison['passed'], comparison
          assert 'object_dimensions' in codes, comparison
          assert any(x['category'] == 'part_size_parameter'
                     for x in diagnosis['hypotheses']), diagnosis
          assert repair['recommendation_count'] > 0, repair
          assert repair['safety']['applies_parameters'] is False, repair
          PY
          fi
          echo "Trusted additive parameter GLB generation and roundtrip controls passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Benchmark BVH and verify feature-prioritized small-hole detection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci/surface_distance
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_surface_distance_smoke.py \
            -- reports/ci/surface_distance \
            2>&1 | tee reports/ci/surface_distance.log
          grep -F 'CBDK_SURFACE_DISTANCE_PASS ' reports/ci/surface_distance.log
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/ci/surface_distance')
          report = json.loads((root / 'surface_distance_experiment.json').read_text())
          assert report['kind'] == 'cbdk_trusted_glb_surface_distance_experiment', report
          assert report['source'] == 'repository_authored_synthetic_only', report
          assert len(report['variants']) == 9, report
          assert all(report['checks'].values()), report
          assert all(v is False for v in report['safety'].values()), report
          a = report['comparisons']['alternate_triangulation']
          h = report['comparisons']['open_hole']
          t = report['comparisons']['raised']
          grid = report['comparisons']['grid_256']
          narrow = report['multires']['narrow_hole']
          panels_old = report['multires']['large_panels_tiny_hole_area_only']
          panels_new = report['multires']['large_panels_tiny_hole_features']
          assert panels_old['refined_symmetric_sampled_max'] == 0, panels_old
          assert panels_new['refined_symmetric_sampled_max'] > .01, panels_new
          assert panels_new['reference_to_candidate']['feature_exploration_face_count'] == 1
          assert panels_new['reference_to_candidate']['area_fallback_face_count'] == 1
          assert panels_new['geometry_feature_prioritization_enabled'] is True
          assert panels_old['geometry_feature_prioritization_enabled'] is False
          assert not panels_new['auto_approve'] and not panels_new['complete_surface_coverage']
          assert all(x is False for x in panels_new['safety'].values())
          assert report['comparisons']['narrow_hole_legacy']['symmetric_sampled_max'] == 0, report
          assert narrow['coarse_symmetric_sampled_max'] == 0, narrow
          assert narrow['refined_symmetric_sampled_max'] > .005, narrow
          assert narrow['new_nonzero_sample_after_refinement'] is True
          assert narrow['coarse_samples_per_triangle'] == 8
          assert narrow['fine_samples_per_selected_triangle'] == 48
          assert narrow['auto_approve'] is False
          assert narrow['complete_surface_coverage'] is False
          assert all(value is False for value in narrow['safety'].values())
          assert report['triangles']['grid_256'] == 256, report
          assert report['triangles']['grid_512'] == 512, report
          assert report['comparisons']['grid_512']['symmetric_mean'] == 0, report
          timings = report['timings']
          small = timings['grid_64_same_input_bvh_vs_bruteforce']
          large = timings['grid_512_bvh_only']
          assert small['reference_triangles'] == 64
          assert large['reference_triangles'] == 512
          assert small['scores_agree_with_brute_force'] is True
          assert large['scores_agree_with_brute_force'] is False
          assert set(small['benchmarks']) == {'bvh', 'brute_force'}
          assert set(large['benchmarks']) == {'bvh'}
          assert all(value['median_elapsed_ms'] >= 0
                     for record in (small, large)
                     for value in record['benchmarks'].values())
          assert all(record['performance_regression_gate'] is False
                     and record['relative_timings_portable'] is False
                     for record in (small, large))
          assert grid['symmetric_mean'] == 0.0, grid
          assert grid['search_acceleration'] == 'deterministic_median_split_triangle_aabb_bvh', grid
          assert grid['reference_to_candidate']['triangle_distance_evaluations'] * 4 < grid['reference_to_candidate']['brute_force_evaluations'], grid
          assert a['symmetric_mean'] < 1e-6, a
          assert h['candidate_to_reference']['mean'] > .01, h
          assert h['symmetric_sampled_max'] > .10, h
          assert 0.249 <= t['symmetric_mean'] <= 0.251, t
          assert all(not v['exact_surface_equivalence_verified']
                     and not v['watertight_solid_equivalence_verified']
                     and not v['safety']['auto_approves']
                     for v in (a, h, t)), report
          for variant in report['variants']:
              assert (root / (variant + '.glb')).stat().st_size > 100
          PY
          echo "Synthetic nine-GLB feature-aware small-cutout controls passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Run local GLB-019 integrated surface-review CLI on imported synthetic pairs
        shell: bash
        run: |
          set -euo pipefail
          root=reports/ci/surface_distance
          python -m cbdk glb-surface-review \
            "$root/filled_main.glb" "$root/with_open_hole.glb" \
            --blender "$BLENDER_PATH" \
            --output "$root/integrated_open_hole.json" --timeout 180
          python -m cbdk glb-surface-review \
            "$root/filled_main.glb" "$root/filled_other.glb" \
            --blender "$BLENDER_PATH" \
            --output "$root/integrated_same_surface.json" --timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/ci/surface_distance')
          hole = json.loads((root / 'integrated_open_hole.json').read_text())
          same = json.loads((root / 'integrated_same_surface.json').read_text())
          for report in (hole, same):
              assert report['kind'] == 'cbdk_glb_surface_review'
              assert report['source'] == 'local_blender_import_aggregate_only'
              assert report['status'] == 'review_only'
              assert report['complete_surface_equivalence_proven'] is False
              assert report['auto_apply'] is False
              assert all(flag is False for flag in report['safety'].values())
              assert 'fixed_surface' in report and 'adaptive_surface' in report
              assert 'source_name' not in report
          assert hole['surface_observation'] == 'sampled_difference_detected'
          assert hole['fixed_surface']['symmetric_sampled_max'] > .10
          assert hole['adaptive_surface']['refined_symmetric_sampled_max'] > 0
          assert same['surface_observation'] == 'no_difference_observed_at_samples'
          assert same['fixed_surface']['symmetric_sampled_max'] < 1e-6
          assert same['adaptive_surface']['refined_symmetric_sampled_max'] < 1e-6
          PY
          echo "GLB-019 imported local pair pipeline, exact source privacy and review-only caps passed." >> "$GITHUB_STEP_SUMMARY"

      - name: GLB-020 review-only colored 3D difference exports and reimport
        shell: bash
        run: |
          set -euo pipefail
          root=reports/ci/surface_distance
          python -m cbdk glb-diff-visualize \
            "$root/filled_main.glb" "$root/with_open_hole.glb" \
            --blender "$BLENDER_PATH" --output "$root/diff_colors" \
            --timeout 180
          python -m cbdk glb-diff-visualize \
            "$root/filled_main.glb" "$root/filled_other.glb" \
            --blender "$BLENDER_PATH" --output "$root/diff_same" \
            --timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/ci/surface_distance')
          hole = json.loads((root / 'diff_colors/review.json').read_text())
          same = json.loads((root / 'diff_same/review.json').read_text())
          for row, folder in ((hole, 'diff_colors'), (same, 'diff_same')):
              assert row['kind'] == 'cbdk_glb_diff_visualization'
              assert row['status'] == 'review_only'
              assert row['sampled_only'] is True
              assert row['complete_surface_equivalence_proven'] is False
              assert row['auto_apply'] is False
              assert all(not flag for flag in row['safety'].values())
              for key in ('reference', 'candidate'):
                  assert 1 <= sum(row[key].values()) <= 512
              for name in row['outputs']:
                  p = root / folder / name
                  assert p.exists() and p.stat().st_size > 100
              assert 'filled_main' not in str(row)
          assert same['reference']['low'] == sum(same['reference'].values())
          assert same['candidate']['low'] == sum(same['candidate'].values())
          assert (hole['reference']['high'] + hole['reference']['medium'] +
                  hole['candidate']['high'] + hole['candidate']['medium']) >= 1
          PY
          "$BLENDER_PATH" --background --factory-startup --disable-autoexec \
            --python-exit-code 7 \
            --python scripts/blender_verify_glb_diff_visualize.py -- \
            "$root/diff_colors/reference_diff.glb" "$root/diff_colors/candidate_diff.glb" \
            2>&1 | tee "$root/glb_diff_reimport.log"
          grep -F 'CBDK_GLB_DIFF_VISUALIZATION_REIMPORT_PASS' "$root/glb_diff_reimport.log"
          echo "GLB-020 directional colored GLB outputs and Blender reimport passed." >> "$GITHUB_STEP_SUMMARY"

      - name: GLB-020 preserve private multipart mesh grouping in colored exports
        shell: bash
        run: |
          set -euo pipefail
          root=reports/ci/surface_distance
          "$BLENDER_PATH" --background --factory-startup --disable-autoexec \
            --python-exit-code 7 \
            --python scripts/blender_make_glb_diff_parts_fixture.py -- \
            "$root/multipart_inputs" \
            2>&1 | tee "$root/glb_diff_parts_fixture.log"
          grep -F 'CBDK_GLB_DIFF_PARTS_FIXTURE_PASS' "$root/glb_diff_parts_fixture.log"
          python -m cbdk glb-diff-visualize \
            "$root/multipart_inputs/multipart_reference.glb" \
            "$root/multipart_inputs/multipart_candidate.glb" \
            --blender "$BLENDER_PATH" --output "$root/diff_multipart" \
            --timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('reports/ci/surface_distance/diff_multipart/review.json').read_text())
          assert review['part_count_limit_per_scene'] == 64
          assert review['cross_file_part_identity_proven'] is False
          assert review['part_id_scheme'] == 'anonymous_sequential_by_imported_object_name'
          assert review['sampled_only'] and not review['auto_apply']
          assert not review['complete_surface_equivalence_proven']
          assert len(review['parts']['reference']) == 2
          assert len(review['parts']['candidate']) == 2
          for side in ('reference', 'candidate'):
              first, second = review['parts'][side]
              assert first['part_id'] == 'part_001'
              assert second['part_id'] == 'part_002'
              assert first['triangle_count'] == second['triangle_count'] == 1
              assert first['low'] == 1 and second['high'] == 1
              assert all(sum(x[key] for x in review['parts'][side]) == review[side][key]
                         for key in ('low', 'medium', 'high'))
          # Private-looking *input* object names never enter the public-safe report.
          assert 'PRIVATE_SOURCE' not in str(review)
          assert 'multipart_reference.glb' not in str(review)
          assert 'multipart_candidate.glb' not in str(review)
          assert review['viewer'] == 'compare_viewer.html'
          assert review['viewer_contains_derived_geometry'] is True
          assert review['viewer_local_only'] is True
          assert review['viewer_shared_camera'] is True
          assert review['viewer_browser_interaction_verified'] is False
          assert review['unobserved_regions_verified'] is False
          audit = review['sampling_sensitivity_audit']
          assert audit['method'] == 'extra_halton_24_probe_sensitivity_v1'
          assert audit['initial_samples_per_triangle'] == 24
          assert audit['additional_samples_per_triangle'] == 24
          assert audit['unobserved_regions_verified'] is False
          for side in ('reference', 'candidate'):
              assert audit[side]['face_count'] == sum(review[side].values())
              assert sum(audit['per_part_sensitive_faces'][side]) == audit[side]['sensitive_faces']
          html = Path('reports/ci/surface_distance/diff_multipart/compare_viewer.html').read_text()
          assert html.count('id="canvas-reference"') == 1
          assert html.count('id="canvas-candidate"') == 1
          assert "connect-src 'none'" in html
          assert '__CBDK_VIEWER_DATA__' not in html
          assert 'PRIVATE_SOURCE_ALPHA' not in html
          assert 'PRIVATE_SOURCE_BETA' not in html
          assert 'multipart_reference.glb' not in html
          assert 'multipart_candidate.glb' not in html
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('reports/ci/surface_distance/diff_multipart/compare_viewer.html').read_text()
          source = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert len(source) == 1, 'Offline viewer must have exactly one executable script'
          Path('reports/ci/surface_distance/diff_multipart/viewer_syntax.js').write_text(source[0])
          PY
          node --check "$root/diff_multipart/viewer_syntax.js"
          "$BLENDER_PATH" --background --factory-startup --disable-autoexec \
            --python-exit-code 7 \
            --python scripts/blender_verify_glb_diff_visualize.py -- \
            "$root/diff_multipart/reference_diff.glb" \
            "$root/diff_multipart/candidate_diff.glb" 2 \
            2>&1 | tee "$root/glb_diff_parts_reimport.log"
          grep -F 'CBDK_GLB_DIFF_VISUALIZATION_REIMPORT_PASS' "$root/glb_diff_parts_reimport.log"
          echo "GLB-020 anonymous 2-part material/reimport checks passed without publishing private sources." >> "$GITHUB_STEP_SUMMARY"

      - name: GLB-020 synthetic closed versus uncapped tetrahedron boundary audit
        shell: bash
        run: |
          set -euo pipefail
          root=reports/ci/surface_distance
          "$BLENDER_PATH" --background --factory-startup --disable-autoexec \
            --python-exit-code 7 \
            --python scripts/blender_make_glb_boundary_fixture.py -- \
            "$root/boundary_inputs" \
            2>&1 | tee "$root/boundary_fixture.log"
          grep -F 'CBDK_BOUNDARY_GLBS_GENERATED_PASS' "$root/boundary_fixture.log"
          python -m cbdk glb-diff-visualize \
            "$root/boundary_inputs/closed_tetra.glb" \
            "$root/boundary_inputs/open_tetra.glb" \
            --blender "$BLENDER_PATH" --output "$root/boundary_review" \
            --timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              'reports/ci/surface_distance/boundary_review/review.json'
          ).read_text())
          audit = report['boundary_edge_audit']
          assert audit['method'] == 'world_space_quantized_triangle_edge_incidence_v1'
          assert audit['fully_watertight_proven'] is False
          assert audit['internal_voids_verified'] is False
          assert audit['coordinate_welding_is_approximate'] is True
          assert audit['reference']['triangle_count'] == 4
          assert audit['candidate']['triangle_count'] == 3
          assert audit['reference']['boundary_edges'] == 0
          assert audit['candidate']['boundary_edges'] == 3
          matches = report['part_match_candidates']
          assert matches['cross_file_part_identity_proven'] is False
          row = matches['reference_parts'][0]
          assert row['status'] == 'ambiguous'
          assert row['topology_review_required'] is True
          html = Path(
              'reports/ci/surface_distance/boundary_review/compare_viewer.html'
          ).read_text(encoding='utf-8')
          assert 'id="show-boundaries"' in html
          assert '__CBDK_VIEWER_DATA__' not in html
          data = json.loads(html.split(
              '<script id="cbdk-viewer-data" type="application/json">', 1
          )[1].split('</script>', 1)[0])
          assert data['boundary_overlay_approximate'] is True
          assert data['boundary_location_proven'] is False
          assert len(data['boundary_overlay']['reference']) == 0
          assert len(data['boundary_overlay']['candidate']) == 3
          assert all(len(line) == 7 and line[0] == 1
                     for line in data['boundary_overlay']['candidate'])
          assert 'SYNTHETIC_BOUNDARY_TEST' not in html
          assert 'SYNTHETIC_BOUNDARY_TEST' not in str(report)
          assert 'closed_tetra.glb' not in str(report)
          assert 'open_tetra.glb' not in str(report)
          assert all(Path('reports/ci/surface_distance/boundary_review', name).exists()
                     for name in ('reference_diff.glb', 'candidate_diff.glb',
                                  'compare_viewer.html'))
          PY
          echo "GLB-020 closed/open triangle edge warnings remain review-only." >> "$GITHUB_STEP_SUMMARY"

      - name: GLB-020 MVP joint-like 3-part end-to-end regression
        shell: bash
        run: |
          set -euo pipefail
          root=reports/ci/joint_mvp
          "$BLENDER_PATH" --background --factory-startup --disable-autoexec \
            --python-exit-code 7 \
            --python scripts/blender_make_glb_joint_mvp_fixtures.py -- \
            "$root/inputs" 2>&1 | tee "reports/ci/joint_mvp_fixture.log"
          grep -F 'CBDK_JOINT_MVP_FIXTURES_PASS' "reports/ci/joint_mvp_fixture.log"
          sha256sum "$root/inputs/"*.glb > "$root/source_sha256.txt"
          for mode in identical narrow shifted uncapped narrow_placebo; do
            python -m cbdk glb-diff-visualize \
              "$root/inputs/reference.glb" "$root/inputs/$mode.glb" \
              --blender "$BLENDER_PATH" \
              --output "$root/review_$mode" --timeout 180
          done
          python scripts/verify_glb_joint_mvp.py "$root"
          python scripts/verify_glb021_joint_review.py "$root"
          python scripts/verify_glb021_synthetic_counterfactual.py "$root"
          # GLB-022: actual staged re-generation and re-comparison, not a
          # replay of cached JSON scores; only CBDK-owned fixed trial names.
          python scripts/run_glb022_synthetic_iteration.py \
            --blender "$BLENDER_PATH" \
            --output reports/ci/glb022_iteration
          # GLB-022 stage 2: generate an additional candidate that fixes the
          # socket but regresses the ball. Both negative cases must be rejected.
          python scripts/run_glb022_synthetic_iteration.py \
            --blender "$BLENDER_PATH" --protocol cross_part \
            --output reports/ci/glb022_multi_iteration
          # GLB-022 stage 3: measure partial improvement via existing
          # aggregated bidirectional sampled maxima; reject shifted-ball
          # regression, accept intermediate improvement, then sampled zero.
          python scripts/run_glb022_synthetic_iteration.py \
            --blender "$BLENDER_PATH" --protocol progressive \
            --output reports/ci/glb022_progress_iteration
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("reports/ci/glb022_iteration")
          h = json.loads((root / "synthetic_iteration_history.json").read_text())
          assert h["status"] == "synthetic_test_only"
          assert h["attempts_executed"] == 2
          assert [row["accepted"] for row in h["attempts"]] == [False, True]
          assert h["stop_reason"] == "observed_zero_and_no_other_part_regression"
          assert h["final_observations"] == {
              "socket_sampled_affected_faces": 0,
              "other_parts_sampled_affected_faces": 0,
          }
          md = (root / "synthetic_iteration_history.md").read_text()
          assert "不採用" in md and "採用（合成実験のみ）" in md
          assert not any(h["safety"].values())
          for mode in ("narrow", "narrow_placebo", "identical"):
              assert (root / ("review_" + mode) / "review.json").is_file()
              assert (root / "synthetic_inputs" / mode / (mode + ".glb")).is_file()
          assert (root / "synthetic_inputs" / "reference" / "reference.glb").is_file()
          # Stage-2 actual generation and cross-part safety checks
          multi_root = Path("reports/ci/glb022_multi_iteration")
          multi = json.loads((multi_root / "synthetic_multi_iteration_history.json").read_text())
          assert multi["status"] == "synthetic_test_only"
          assert multi["attempts_executed"] == 3
          assert [a["accepted"] for a in multi["attempts"]] == [False, False, True]
          assert [a["decision"] for a in multi["attempts"]] == [
              "socket_not_improved",
              "unrelated_part_regression",
              "strict_sampled_socket_improvement_no_observed_regression",
          ]
          assert multi["accepted_candidate_id"] == "identical"
          assert multi["final_observations"] == {
              "socket_sampled_affected_faces": 0,
              "other_parts_sampled_affected_faces": 0,
          }
          assert multi["stop_reason"] == "sampled_zero_without_other_part_regression"
          assert not any(multi["safety"].values())
          multi_md = (multi_root / "synthetic_multi_iteration_history.md").read_text()
          assert "棄却（他部品が悪化）" in multi_md
          assert "採用（合成モデル限定）" in multi_md
          for name in ("narrow", "narrow_placebo", "shifted", "identical"):
              assert (multi_root / ("review_" + name) / "review.json").is_file()
              assert (multi_root / "synthetic_inputs" / name / (name + ".glb")).is_file()
          assert (multi_root / "synthetic_inputs" / "reference" / "reference.glb").is_file()
          progress_root = Path("reports/ci/glb022_progress_iteration")
          progress = json.loads((progress_root / "synthetic_progress_history.json").read_text())
          assert progress["status"] == "synthetic_test_only"
          assert progress["metric"] == "global_bidirectional_sampled_max_distance_input_units"
          assert progress["metric_is_part_specific"] is False
          assert progress["metric_is_exact_hausdorff"] is False
          assert [step["accepted"] for step in progress["attempts"]] == [False, True, True]
          assert [step["baseline_before"] for step in progress["attempts"]] == [
              "narrow", "narrow", "narrow_mid",
          ]
          assert progress["attempts"][0]["decision"] == "other_part_regression"
          assert (progress["attempts"][1]["sampled_max_candidate"]
                  < progress["attempts"][1]["sampled_max_before"])
          assert progress["accepted_trial_id"] == "identical"
          assert progress["stop_reason"] == "observed_sampled_zero"
          assert progress["final_sampled_max"] <= 0.000001
          assert not any(progress["safety"].values())
          md = (progress_root / "synthetic_progress_history.md").read_text()
          assert "段階的改善" in md and "棄却（他部品悪化）" in md
          for name in ("narrow", "narrow_mid_shifted", "narrow_mid", "identical"):
              assert (progress_root / ("review_" + name) / "review.json").is_file()
              assert (progress_root / "synthetic_inputs" / name / (name + ".glb")).is_file()
          PY
          sha256sum --check "$root/source_sha256.txt"
          echo "GLB-020 joint-like MVP: exact negative control, narrow socket, moved ball, uncapped lip, privacy check all passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Create and render deterministic GLB visual-inspection fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci/glb_preview
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_make_glb_fixture.py \
