            -- reports/ci/glb_fixture_drift.glb silhouette-drift \
            2>&1 | tee reports/ci/glb_fixture_drift.log
          grep -F 'CBDK_GLB_FIXTURE_PASS reference ' reports/ci/glb_fixture.log
          grep -F 'CBDK_GLB_FIXTURE_PASS silhouette-drift ' reports/ci/glb_fixture_drift.log
          python -m cbdk glb-inspect reports/ci/glb_fixture.glb \
