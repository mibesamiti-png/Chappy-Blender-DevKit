name: CBDK Blender multi-version runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'parts/blender/**'
      - 'cbdk/blender_test.py'
      - 'cbdk/evidence.py'
      - 'cbdk/__main__.py'
      - 'scripts/blender_parts_smoke.py'
      - 'cbdk/addon_builder.py'
      - 'cbdk/modular_builder.py'
      - 'cbdk/feature_catalog.py'
      - 'catalog/addon_features.json'
      - 'recipes/**'
      - 'templates/mesh_inspector/**'
      - 'templates/modular_preview/**'
      - 'scripts/blender_generated_addon_smoke.py'
      - 'scripts/blender_modular_addon_smoke.py'
      - 'scripts/blender_audit_scaling_smoke.py'
      - '.github/workflows/blender-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blender-parts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blender-version: ['4.4.3', '4.5.15', '5.2.1']
    timeout-minutes: 25
    env:
      BLENDER_VERSION: ${{ matrix.blender-version }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout (no private input sources)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for CBDK CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official Blender Linux binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/${archive}" -o "${archive}"
          grep -F "${archive}" blender.sha256 | sha256sum --check --status
          tar -xJf "${archive}"
          echo "BLENDER_PATH=$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Check Blender is executable
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --version | head -n 3
      - name: Run real Blender parts checks and save evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          python -m cbdk verify-parts --blender "$BLENDER_PATH" --timeout 180 \
            --output reports/ci/parts_evidence.json 2>&1 | tee reports/ci/blender.log
          python -m cbdk evidence-status --evidence reports/ci/parts_evidence.json \
            2>&1 | tee reports/ci/evidence_status.log
          python -m cbdk part-matrix --evidence reports/ci/parts_evidence.json \
            --output reports/ci/parts_matrix.json 2>&1 | tee reports/ci/part_matrix.log
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('reports/ci/parts_evidence.json').read_text())
          assert p['run_status'] == 'passed', p
          assert set(p['parts']) == {'BLCTX-001', 'BLCTX-002', 'BME-001', 'BME-002', 'BME-003', 'BLGEO-001', 'BLMOD-001'}, p
          assert all(x['status'] == 'blender_smoke_passed' for x in p['parts'].values()), p
          with Path('reports/ci/summary.md').open('w', encoding='utf-8') as f:
              f.write('# CBDK Blender runtime test\n\n')
              f.write(f"Blender: **{p['blender_version']}**  \n")
              f.write('Parts passed: **7/7** (smoke only; not approved)\n')
          PY
          cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify authored feature catalog and preview plan for target Blender
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk feature-list --output reports/ci/feature_catalog.json             2>&1 | tee reports/ci/feature_catalog.log
          python -m cbdk addon-plan --recipe recipes/modular_all.json             --target-blender "$BLENDER_VERSION" --output reports/ci/addon_plan.json             2>&1 | tee reports/ci/addon_plan.log
      - name: Build private development-preview addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk build-addon \
            --recipe recipes/mesh_inspector.json \
            --target-blender "$BLENDER_VERSION" \
            --preview-unapproved \
            --output reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/addon_build.log
      - name: Activate generated addon and test operator in real Blender
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_generated_addon_smoke.py \
            -- reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/generated_addon_smoke.log
          grep -F 'CBDK_GENERATED_ADDON_PASS ' reports/ci/generated_addon_smoke.log
          echo "Generated preview add-on: enable, Object/Edit operators, negative case and disable PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Build and test six modular recipe combinations in real Blender
        shell: bash
        run: |
          set -euo pipefail
          for recipe in modular_objects modular_edit modular_combined modular_geometry modular_nudge modular_all; do
            output="reports/ci/CBDK_${recipe}_Preview.zip"
            python -m cbdk build-addon \
              --recipe "recipes/${recipe}.json" \
              --target-blender "$BLENDER_VERSION" \
              --preview-unapproved \
              --output "$output" 2>&1 | tee "reports/ci/${recipe}_build.log"
            "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
              --python scripts/blender_modular_addon_smoke.py \
              -- "$output" 2>&1 | tee "reports/ci/${recipe}_smoke.log"
            grep -F 'CBDK_MODULAR_ADDON_PASS ' "reports/ci/${recipe}_smoke.log"
          done
          echo 'Modular preview variants: objects, edit, combined, geometry, nudge and all PASSED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Measure guarded audit on medium real Blender mesh
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_audit_scaling_smoke.py \
            2>&1 | tee reports/ci/audit_scaling_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows = Path('reports/ci/audit_scaling_smoke.log').read_text().splitlines()
          matches = [x.split('CBDK_AUDIT_SCALING_PASS ', 1)[1]
                     for x in rows if 'CBDK_AUDIT_SCALING_PASS ' in x]
          assert len(matches) == 1, matches
          data = json.loads(matches[0])
          assert data['postedit_audit_passed'] and data['no_mutation_on_limit']
          Path('reports/ci/audit_scaling.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Real Blender guarded audit scaling and mutation-free over-limit reject PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence and log even when Blender fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbdk-blender-${{ matrix.blender-version }}-smoke-${{ github.run_id }}
          path: reports/ci/
          retention-days: 14
          if-no-files-found: warn
