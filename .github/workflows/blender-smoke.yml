name: CBDK Blender multi-version runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'docs/project/STATE.json'
      - 'parts/blender/**'
      - 'cbdk/blender_test.py'
      - 'cbdk/evidence.py'
      - 'cbdk/__main__.py'
      - 'scripts/blender_parts_smoke.py'
      - 'cbdk/addon_builder.py'
      - 'cbdk/modular_builder.py'
      - 'cbdk/feature_catalog.py'
      - 'catalog/addon_features.json'
      - 'recipes/**'
      - 'templates/mesh_inspector/**'
      - 'templates/modular_preview/**'
      - 'scripts/blender_generated_addon_smoke.py'
      - 'scripts/blender_modular_addon_smoke.py'
      - 'scripts/blender_audit_scaling_smoke.py'
      - 'scripts/blender_undo_redo_smoke.py'
      - 'cbdk/undo_probe_report.py'
      - 'cbdk/glb_inspector.py'
      - 'cbdk/glb_render.py'
      - 'tests/test_glb_regression.py'
      - 'tests/test_glb_compare.py'
      - 'cbdk/glb_regression.py'
      - 'cbdk/glb_compare.py'
      - 'tests/test_glb_diagnose.py'
      - 'cbdk/glb_diagnose.py'
      - 'cbdk/glb_repair_plan.py'
      - 'cbdk/glb_property_map.py'
      - 'cbdk/glb_property_usage.py'
      - 'tests/test_glb_repair_plan.py'
      - 'tests/test_glb_property_map.py'
      - 'tests/test_glb_property_usage.py'
      - 'scripts/blender_glb_render.py'
      - 'scripts/blender_make_glb_fixture.py'
      - 'tests/test_glb_inspector.py'
      - '.github/workflows/blender-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blender-parts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        blender-version: ['4.4.3', '4.5.15', '5.2.1']
    timeout-minutes: 25
    env:
      BLENDER_VERSION: ${{ matrix.blender-version }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout (no private input sources)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python for CBDK CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless EGL/OpenGL runtime for preview rendering
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Download official Blender Linux binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
            "${base}/${archive}" -o "${archive}"
          grep -F "${archive}" blender.sha256 | sha256sum --check --status
          tar -xJf "${archive}"
          echo "BLENDER_PATH=$PWD/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Check Blender is executable
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --version | head -n 3
      - name: Run real Blender parts checks and save evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          python -m cbdk verify-parts --blender "$BLENDER_PATH" --timeout 180 \
            --output reports/ci/parts_evidence.json 2>&1 | tee reports/ci/blender.log
          python -m cbdk evidence-status --evidence reports/ci/parts_evidence.json \
            2>&1 | tee reports/ci/evidence_status.log
          python -m cbdk part-matrix --evidence reports/ci/parts_evidence.json \
            --output reports/ci/parts_matrix.json 2>&1 | tee reports/ci/part_matrix.log
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('reports/ci/parts_evidence.json').read_text())
          assert p['run_status'] == 'passed', p
          assert set(p['parts']) == {'BLCTX-001', 'BLCTX-002', 'BME-001', 'BME-002', 'BME-003', 'BLGEO-001', 'BLMOD-001'}, p
          assert all(x['status'] == 'blender_smoke_passed' for x in p['parts'].values()), p
          with Path('reports/ci/summary.md').open('w', encoding='utf-8') as f:
              f.write('# CBDK Blender runtime test\n\n')
              f.write(f"Blender: **{p['blender_version']}**  \n")
              f.write('Parts passed: **7/7** (smoke only; not approved)\n')
          PY
          cat reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify authored feature catalog and preview plan for target Blender
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk.recipe_matrix --output reports/ci/recipe_matrix.json \
            2>&1 | tee reports/ci/recipe_matrix.log
          python -m cbdk feature-list --output reports/ci/feature_catalog.json             2>&1 | tee reports/ci/feature_catalog.log
          python -m cbdk addon-plan --recipe recipes/modular_all.json             --target-blender "$BLENDER_VERSION" --output reports/ci/addon_plan.json             2>&1 | tee reports/ci/addon_plan.log
      - name: Build private development-preview addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m cbdk build-addon \
            --recipe recipes/mesh_inspector.json \
            --target-blender "$BLENDER_VERSION" \
            --preview-unapproved \
            --output reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/addon_build.log
      - name: Activate generated addon and test operator in real Blender
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_generated_addon_smoke.py \
            -- reports/ci/CBDK_Mesh_Inspector_Preview.zip \
            2>&1 | tee reports/ci/generated_addon_smoke.log
          grep -F 'CBDK_GENERATED_ADDON_PASS ' reports/ci/generated_addon_smoke.log
          echo "Generated preview add-on: enable, Object/Edit operators, negative case and disable PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Build and test six modular recipe combinations in real Blender
        shell: bash
        run: |
          set -euo pipefail
          for recipe in modular_objects modular_edit modular_combined modular_geometry modular_nudge modular_all; do
            output="reports/ci/CBDK_${recipe}_Preview.zip"
            python -m cbdk build-addon \
              --recipe "recipes/${recipe}.json" \
              --target-blender "$BLENDER_VERSION" \
              --preview-unapproved \
              --output "$output" 2>&1 | tee "reports/ci/${recipe}_build.log"
            "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
              --python scripts/blender_modular_addon_smoke.py \
              -- "$output" 2>&1 | tee "reports/ci/${recipe}_smoke.log"
            grep -F 'CBDK_MODULAR_ADDON_PASS ' "reports/ci/${recipe}_smoke.log"
          done
          echo 'Modular preview variants: objects, edit, combined, geometry, nudge and all PASSED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Probe native Undo and Redo (background only, not GUI hotkeys)
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_undo_redo_smoke.py \
            -- reports/ci/CBDK_modular_nudge_Preview.zip \
            2>&1 | tee reports/ci/undo_redo_smoke.log
          python -m cbdk.undo_probe_report \
            reports/ci/undo_redo_smoke.log reports/ci/undo_redo.json
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Native Undo/Redo was **probed** in background Blender.
          See undo_redo.json: an unavailable poll is **not** counted as passed.
          GUI Ctrl+Z / Ctrl+Shift+Z remains unverified.
          EOF
      - name: Measure guarded audit on medium real Blender mesh
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_audit_scaling_smoke.py \
            2>&1 | tee reports/ci/audit_scaling_smoke.log
          python - <<'PY'
          import json
          from pathlib import Path
          rows = Path('reports/ci/audit_scaling_smoke.log').read_text().splitlines()
          matches = [x.split('CBDK_AUDIT_SCALING_PASS ', 1)[1]
                     for x in rows if 'CBDK_AUDIT_SCALING_PASS ' in x]
          assert len(matches) == 1, matches
          data = json.loads(matches[0])
          assert data['postedit_audit_passed'] and data['no_mutation_on_limit']
          Path('reports/ci/audit_scaling.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Real Blender guarded audit scaling and mutation-free over-limit reject PASSED." >> "$GITHUB_STEP_SUMMARY"
      - name: Create and render deterministic GLB visual-inspection fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci/glb_preview
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_make_glb_fixture.py \
            -- reports/ci/glb_fixture.glb reference \
            2>&1 | tee reports/ci/glb_fixture.log
          "$BLENDER_PATH" --background --factory-startup --python-exit-code 7 \
            --python scripts/blender_make_glb_fixture.py \
            -- reports/ci/glb_fixture_drift.glb silhouette-drift \
            2>&1 | tee reports/ci/glb_fixture_drift.log
          grep -F 'CBDK_GLB_FIXTURE_PASS reference ' reports/ci/glb_fixture.log
          grep -F 'CBDK_GLB_FIXTURE_PASS silhouette-drift ' reports/ci/glb_fixture_drift.log
          python -m cbdk glb-inspect reports/ci/glb_fixture.glb \
            --output reports/ci/glb_preview/structure_only.json \
            2>&1 | tee reports/ci/glb_inspect.log
          python -m cbdk glb-preview reports/ci/glb_fixture.glb \
            --blender "$BLENDER_PATH" \
            --output reports/ci/glb_preview \
            --resolution 256 --timeout 180 \
            2>&1 | tee reports/ci/glb_preview.log
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('reports/ci/glb_preview')
          expected = {'front.png', 'back.png', 'right.png', 'left.png', 'top.png', 'bottom.png', 'iso.png'}
          missing = sorted(name for name in expected if not (root / name).is_file())
          assert not missing, missing

          static = json.loads((root / 'structure.json').read_text(encoding='utf-8'))
          scene = json.loads((root / 'scene_metadata.json').read_text(encoding='utf-8'))
          assert static['kind'] == 'cbdk_glb_static_inspection', static
          assert static['counts']['nodes'] >= 2, static['counts']
          assert static['counts']['meshes'] >= 2, static['counts']
          assert scene['kind'] == 'cbdk_glb_blender_scene_metadata', scene
          assert scene['object_count'] == 2, scene['object_count']
          assert set(scene['views']) == expected, scene['views']
          assert {obj['name'] for obj in scene['objects']} == {
              'CBDK_Test_Cube', 'CBDK_Test_Sphere'
          }, scene['objects']
          PY
          python -m cbdk glb-compare \
            reports/ci/glb_preview/scene_metadata.json \
            reports/ci/glb_preview/scene_metadata.json \
            --output reports/ci/glb_self_compare.json

          python -m cbdk glb-preview reports/ci/glb_fixture_drift.glb \
            --blender "$BLENDER_PATH" \
            --output reports/ci/glb_drift_preview \
            --resolution 256 --timeout 180 \
            2>&1 | tee reports/ci/glb_drift_preview.log

          set +e
          python -m cbdk glb-compare \
            reports/ci/glb_preview/scene_metadata.json \
            reports/ci/glb_drift_preview/scene_metadata.json \
            --output reports/ci/glb_drift_compare.json \
            --scene-rel-tol 0.20 --dimension-rel-tol 0.20 --center-rel-tol 0.20 \
            --silhouette-iou-min 0.90
          drift_status=$?
          set -e
          test "$drift_status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/ci/glb_drift_compare.json').read_text())
          codes = {row['code'] for row in report['differences'] if row['severity'] == 'error'}
          assert not report['passed'], report
          assert 'scene_silhouette' in codes or 'object_silhouette' in codes, report
          assert 'object_dimensions' not in codes, report
          PY
          python -m cbdk glb-diagnose reports/ci/glb_drift_compare.json --output reports/ci/glb_drift_diagnosis.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/ci/glb_drift_diagnosis.json').read_text())
          assert d['hypothesis_count'] >= 1, d
          cats={x['category'] for x in d['hypotheses']}
          assert 'part_profile_boolean_or_cutout' in cats or 'assembly_shape_mismatch' in cats, d
          assert d['safety']['edits_code'] is False, d
          silhouette = [item for item in d['hypotheses']
                        if item['category'] in ('part_profile_boolean_or_cutout',
                                                'assembly_shape_mismatch')]
          assert silhouette, d
          assert any(0 <= item['evidence_summary']['worst_iou'] < 0.90
                     and item['evidence_summary']['affected_views']
                     and item['evidence_summary']['evidence_count'] >= 1
                     for item in silhouette), d
          assert d['evidence_summary']['errors'] >= 1, d
          assert d['safety']['auto_approves'] is False, d
          PY
          python -m cbdk glb-repair-plan reports/ci/glb_drift_compare.json \
            --output reports/ci/glb_drift_repair_plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('reports/ci/glb_drift_repair_plan.json').read_text())
          assert p['kind'] == 'cbdk_glb_repair_plan', p
          assert p['status'] == 'review_only', p
          assert p['recommendation_count'] >= 1, p
          assert any(x['worst_iou'] is not None and x['worst_iou'] < 0.90
                     and x['affected_views']
                     and x['requires_human_parameter_mapping']
                     for x in p['recommendations']), p
          assert p['safety']['edits_code'] is False, p
          assert p['safety']['applies_parameters'] is False, p
          PY
          # This is a synthetic fixture. The source is NEVER imported or run.
          cat > reports/ci/synthetic_property_declarations.py <<'PY'
          import bpy
          from bpy.props import FloatProperty

          class CBDKFixtureProperties:
              profile_shape: FloatProperty(name="Profile shape", default=1.0)
              boolean_cutter: FloatProperty(name="Boolean cutter", default=1.0)
              visible_profile: FloatProperty(name="Visible profile", default=1.0)
              part_arrangement: FloatProperty(name="Part arrangement", default=1.0)

              def read_profile(self):
                  return self.profile_shape + self.visible_profile

              def alter_profile(self):
                  self.profile_shape += 0.1
                  self.profile_shape = 1.0
                  self.boolean_cutter += 0.1
                  self.boolean_cutter = 1.0
                  self.visible_profile += 0.1
                  self.visible_profile = 1.2
                  self.part_arrangement += 0.1
                  self.part_arrangement = 1.0

              def build_geometry(self):
                  radius = self.boolean_cutter / 2
                  bpy.ops.mesh.primitive_uv_sphere_add(radius=radius)
                  bpy.ops.mesh.primitive_cube_add(size=self.profile_shape)
          PY
          python -m cbdk glb-map-properties \
            reports/ci/glb_drift_repair_plan.json \
            --source reports/ci/synthetic_property_declarations.py \
            --output reports/latest/ci_property_mapping.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('reports/latest/ci_property_mapping.json').read_text())
          assert m['kind'] == 'cbdk_glb_property_mapping', m
          assert m['static_property_declarations_found'] == 4, m
          hits = [match for rec in m['recommendations']
                  for match in rec['exact_name_matches']]
          assert hits, m
          assert all(match['match'] == 'exact_declaration_name_only' for match in hits), m
          assert m['static_possible_attribute_references_found'] == 12, m
          assert m['static_possible_geometry_paths_found'] >= 2, m
          linked = [hit for hit in hits
                    if hit['possible_geometry_dataflow']['possible_path_count'] > 0]
          assert linked, m
          assert any(site['geometry_operation_category'] == 'mesh_primitive'
                     for hit in linked
                     for site in hit['possible_geometry_dataflow']['examples']), m
          assert all(hit['possible_geometry_dataflow']['receiver_binding_verified'] is False
                     and hit['possible_geometry_dataflow']['geometry_effect_verified'] is False
                     for hit in hits), m
          assert any(x['possible_code_references']['possible_reference_count'] > 0
                     and x['possible_code_references']['access_counts']['read'] > 0
                     for x in hits), m
          assert any(x['possible_code_references']['access_counts']['read_write'] > 0
                     for x in hits), m
          assert any(x['possible_code_references']['access_counts']['write'] > 0
                     for x in hits), m
          assert all(x['possible_code_references']['runtime_effect_verified'] is False
                     for x in hits), m
          # Same-class self references narrow the inspection scope, but are
          # syntactic hints only, NOT proven Blender property usage.
          assert any(x['same_class_reference_review']['possible_same_source_class_self_count'] > 0
                     for x in hits), m
          assert all(x['same_class_reference_review']['actual_receiver_binding_verified'] is False
                     and x['same_class_reference_review']['registered_in_blender_verified'] is False
                     and x['same_class_reference_review']['geometry_effect_verified'] is False
                     for x in hits), m
          assert m['safety']['source_executed'] is False, m
          assert m['safety']['applies_parameters'] is False, m
          assert m['safety']['private_source_committed'] is False, m
          PY

          if [ "$BLENDER_VERSION" = "4.5.15" ]; then
            set +e
            python -m cbdk glb-regression \
              reports/ci/glb_fixture.glb reports/ci/glb_fixture_drift.glb \
              --blender "$BLENDER_PATH" \
              --output reports/ci/glb_regression_e2e \
              --resolution 256 --timeout 180 \
              --scene-rel-tol 0.20 --dimension-rel-tol 0.20 --center-rel-tol 0.20 \
              --silhouette-iou-min 0.90
            regression_status=$?
            set -e
            test "$regression_status" -eq 1
            test -f reports/ci/glb_regression_e2e/diagnosis.json
            test -f reports/ci/glb_regression_e2e/repair_plan.json
          fi
          echo "GLB views, silhouettes, self-compare, same-bounds silhouette drift detection and e2e regression behavior PASSED." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence and log even when Blender fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbdk-blender-${{ matrix.blender-version }}-smoke-${{ github.run_id }}
          path: reports/ci/
          retention-days: 14
          if-no-files-found: warn
