            2>&1 | tee reports/ci/glb_preview.log
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('reports/ci/glb_preview')
          expected = {'front.png', 'back.png', 'right.png', 'left.png', 'top.png', 'bottom.png', 'iso.png'}
          missing = sorted(name for name in expected if not (root / name).is_file())
          assert not missing, missing

          static = json.loads((root / 'structure.json').read_text(encoding='utf-8'))
          scene = json.loads((root / 'scene_metadata.json').read_text(encoding='utf-8'))
          assert static['kind'] == 'cbdk_glb_static_inspection', static
          assert static['counts']['nodes'] >= 2, static['counts']
          assert static['counts']['meshes'] >= 2, static['counts']
          assert scene['kind'] == 'cbdk_glb_blender_scene_metadata', scene
          assert scene['object_count'] == 2, scene['object_count']
          assert set(scene['views']) == expected, scene['views']
          assert {obj['name'] for obj in scene['objects']} == {
              'CBDK_Test_Cube', 'CBDK_Test_Sphere'
          }, scene['objects']
          PY
          python -m cbdk glb-compare \
            reports/ci/glb_preview/scene_metadata.json \
            reports/ci/glb_preview/scene_metadata.json \
            --output reports/ci/glb_self_compare.json

          python -m cbdk glb-preview reports/ci/glb_fixture_drift.glb \
            --blender "$BLENDER_PATH" \
            --output reports/ci/glb_drift_preview \
            --resolution 256 --timeout 180 \
            2>&1 | tee reports/ci/glb_drift_preview.log

          set +e
          python -m cbdk glb-compare \
            reports/ci/glb_preview/scene_metadata.json \
            reports/ci/glb_drift_preview/scene_metadata.json \
            --output reports/ci/glb_drift_compare.json \
            --scene-rel-tol 0.20 --dimension-rel-tol 0.20 --center-rel-tol 0.20 \
            --silhouette-iou-min 0.90
          drift_status=$?
          set -e
          test "$drift_status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/ci/glb_drift_compare.json').read_text())
          codes = {row['code'] for row in report['differences'] if row['severity'] == 'error'}
          assert not report['passed'], report
          assert 'scene_silhouette' in codes or 'object_silhouette' in codes, report
          assert 'object_dimensions' not in codes, report
          PY
          python -m cbdk glb-diagnose reports/ci/glb_drift_compare.json --output reports/ci/glb_drift_diagnosis.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/ci/glb_drift_diagnosis.json').read_text())
          assert d['hypothesis_count'] >= 1, d
          cats={x['category'] for x in d['hypotheses']}
          assert 'part_profile_boolean_or_cutout' in cats or 'assembly_shape_mismatch' in cats, d
          assert d['safety']['edits_code'] is False, d
          silhouette = [item for item in d['hypotheses']
                        if item['category'] in ('part_profile_boolean_or_cutout',
                                                'assembly_shape_mismatch')]
          assert silhouette, d
          assert any(0 <= item['evidence_summary']['worst_iou'] < 0.90
                     and item['evidence_summary']['affected_views']
                     and item['evidence_summary']['evidence_count'] >= 1
                     for item in silhouette), d
          assert d['evidence_summary']['errors'] >= 1, d
          assert d['safety']['auto_approves'] is False, d
          PY
          python -m cbdk glb-repair-plan reports/ci/glb_drift_compare.json \
            --output reports/ci/glb_drift_repair_plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('reports/ci/glb_drift_repair_plan.json').read_text())
          assert p['kind'] == 'cbdk_glb_repair_plan', p
          assert p['status'] == 'review_only', p
          assert p['recommendation_count'] >= 1, p
          assert any(x['worst_iou'] is not None and x['worst_iou'] < 0.90
                     and x['affected_views']
                     and x['requires_human_parameter_mapping']
                     for x in p['recommendations']), p
          assert p['safety']['edits_code'] is False, p
          assert p['safety']['applies_parameters'] is False, p
          PY
          # This is a synthetic fixture. The source is NEVER imported or run.
          cat > reports/ci/synthetic_property_declarations.py <<'PY'
          import bpy
          from bpy.props import FloatProperty

          class CBDKFixtureProperties:
              profile_shape: FloatProperty(name="Profile shape", default=1.0)
              boolean_cutter: FloatProperty(name="Boolean cutter", default=1.0)
              visible_profile: FloatProperty(name="Visible profile", default=1.0)
              part_arrangement: FloatProperty(name="Part arrangement", default=1.0)

              def read_profile(self):
                  return self.profile_shape + self.visible_profile

              def alter_profile(self):
                  self.profile_shape += 0.1
                  self.profile_shape = 1.0
                  self.boolean_cutter += 0.1
                  self.boolean_cutter = 1.0
                  self.visible_profile += 0.1
                  self.visible_profile = 1.2
                  self.part_arrangement += 0.1
                  self.part_arrangement = 1.0

              def build_geometry(self):
                  radius = self.boolean_cutter / 2
                  bpy.ops.mesh.primitive_uv_sphere_add(radius=radius)
                  bpy.ops.mesh.primitive_cube_add(size=self.profile_shape)

              def configure_modifiers(self, modifier):
                  modifier.width = self.profile_shape
                  modifier.thickness = self.boolean_cutter
          PY
          python -m cbdk glb-map-properties \
            reports/ci/glb_drift_repair_plan.json \
            --source reports/ci/synthetic_property_declarations.py \
            --output reports/latest/ci_property_mapping.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('reports/latest/ci_property_mapping.json').read_text())
          assert m['kind'] == 'cbdk_glb_property_mapping', m
          assert m['static_property_declarations_found'] == 4, m
          hits = [match for rec in m['recommendations']
                  for match in rec['exact_name_matches']]
          assert hits, m
          assert all(match['match'] == 'exact_declaration_name_only' for match in hits), m
          assert m['static_possible_attribute_references_found'] == 14, m
          assert m['static_possible_geometry_paths_found'] >= 2, m
          linked = [hit for hit in hits
                    if hit['possible_geometry_dataflow']['possible_path_count'] > 0]
          assert linked, m
          assert any(site['geometry_operation_category'] == 'mesh_primitive'
                     for hit in linked
                     for site in hit['possible_geometry_dataflow']['examples']), m
          assert any(site['geometry_operation_category'] == 'possible_modifier_setting_assignment'
                     and site['recognized_api'] in ('modifier.width', 'modifier.thickness')
                     for hit in linked
                     for site in hit['possible_geometry_dataflow']['examples']), m
          assert all(hit['possible_geometry_dataflow']['receiver_binding_verified'] is False
                     and hit['possible_geometry_dataflow']['geometry_effect_verified'] is False
                     for hit in hits), m
          assert any(x['possible_code_references']['possible_reference_count'] > 0
                     and x['possible_code_references']['access_counts']['read'] > 0
                     for x in hits), m
          assert any(x['possible_code_references']['access_counts']['read_write'] > 0
                     for x in hits), m
          assert any(x['possible_code_references']['access_counts']['write'] > 0
                     for x in hits), m
          assert all(x['possible_code_references']['runtime_effect_verified'] is False
                     for x in hits), m
          # Same-class self references narrow the inspection scope, but are
          # syntactic hints only, NOT proven Blender property usage.
          assert any(x['same_class_reference_review']['possible_same_source_class_self_count'] > 0
                     for x in hits), m
          assert all(x['same_class_reference_review']['actual_receiver_binding_verified'] is False
                     and x['same_class_reference_review']['registered_in_blender_verified'] is False
                     and x['same_class_reference_review']['geometry_effect_verified'] is False
                     for x in hits), m
          assert m['safety']['source_executed'] is False, m
          assert m['safety']['applies_parameters'] is False, m
          assert m['safety']['private_source_committed'] is False, m
          PY

          if [ "$BLENDER_VERSION" = "4.5.15" ]; then
            set +e
            python -m cbdk glb-regression \
              reports/ci/glb_fixture.glb reports/ci/glb_fixture_drift.glb \
              --blender "$BLENDER_PATH" \
              --output reports/ci/glb_regression_e2e \
              --resolution 256 --timeout 180 \
              --scene-rel-tol 0.20 --dimension-rel-tol 0.20 --center-rel-tol 0.20 \
              --silhouette-iou-min 0.90
            regression_status=$?
            set -e
            test "$regression_status" -eq 1
            test -f reports/ci/glb_regression_e2e/diagnosis.json
            test -f reports/ci/glb_regression_e2e/repair_plan.json
          fi
          echo "GLB views, silhouettes, self-compare, same-bounds silhouette drift detection and e2e regression behavior PASSED." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence and log even when Blender fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbdk-blender-${{ matrix.blender-version }}-smoke-${{ github.run_id }}
          path: reports/ci/
          retention-days: 14
          if-no-files-found: warn
