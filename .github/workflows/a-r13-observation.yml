name: A isolated R13 observation diagnostic

on:
  push:
    branches: ['work/a-r13-observation-20261126']

permissions:
  contents: read

jobs:
  windows-repair:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.9', '3.12', '3.13.17']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deterministic old and new reader comparison
        run: python experiments/r13_observation/compare_repair.py
      - name: Original focused controls and full suite
        if: always()
        run: |
          python experiments/r13_observation/observe.py focused
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -q
          exit $LASTEXITCODE
  posix-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -q
