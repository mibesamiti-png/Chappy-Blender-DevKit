name: A isolated R13 observation diagnostic

on:
  push:
    branches: ['work/a-r13-observation-20261126']

permissions:
  contents: read

jobs:
  native-clocks:
    runs-on: windows-2022
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11.9', '3.13.17']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compare stat fstat and Win32 FileBasicInfo clocks
        run: python experiments/r13_observation/native_clocks.py
