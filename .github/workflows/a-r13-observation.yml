name: A isolated R13 observation diagnostic

on:
  push:
    branches: ['work/a-r13-observation-20261126']

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: One instrumented full suite
        run: python experiments/r13_observation/observe.py full
      - name: Twenty focused repetitions in a fresh process
        if: always()
        run: python experiments/r13_observation/observe.py focused
