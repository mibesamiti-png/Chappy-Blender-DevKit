      - name: Verify alternate planar diagonals and strict protection
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase173_alternate_diagonal.py
          python - <<'PY'
          import json
          from pathlib import Path
