          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==8
          assert all(r["preflight"]["passed"]==r["expected"] for r in d["rows"])
          assert all(not r["accepted"] for r in d["rows"] if not r["expected"])
          assert all(r["native"]["rollback_exact"] for r in d["rows"] if r["native"] is not None)
          print("Accepted",sum(r["accepted"] for r in d["rows"]))
          PY
      - name: Verify bounded hole relocation proposals
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase165_bounded_hole_relocation.py
          python - <<'PY'
          import json
