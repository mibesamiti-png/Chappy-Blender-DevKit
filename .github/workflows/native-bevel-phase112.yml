          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase166_group_constraints.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase166_group_constraints.json").read_text())
