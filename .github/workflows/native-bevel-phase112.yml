          assert len(d["rows"])==10 and all(r["matched"] and not r["persistent_edit"] for r in d["rows"])
          assert sum(r["status"]=="proposal_verified" for r in d["rows"])==5
          assert all(r["native"]["rollback_exact"] for r in d["rows"] if r["native"] is not None)
          PY
      - name: Verify grouped hole relocation with explicit geometric constraints
