name: Geometry Lab isolated operations Phase 206
on:
  pull_request:
    paths:
      - 'research/native_bevel_phase112/**'
      - '.github/workflows/native-bevel-phase112.yml'
permissions:
  contents: read
concurrency:
  group: native-bevel-phase112-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-bevel:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check research Python syntax before native experiments
        run: python -m compileall -q .
      - name: Verify frozen synthetic inputs
        run: |
          set -euo pipefail
          echo 'e6665689f92ca582dccd49e2a2dff720a412bff9c0ae63fe90946ede6b143200  phase111_fixtures.json' | sha256sum --check
          echo 'af9aa832ececf2316ee75b630bd55f9a1696e418ff4e53c7f8e97a6a2918243c  phase112_native_benchmark.py' | sha256sum --check
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned publisher Blender archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Recheck six frozen collars in Blender
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          echo 'd553b9541e8a080164b8550cdb270daf12423899aaf3f503a4c925e59bd91ed3  phase131_frozen_meshes.json' | sha256sum --check
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase132_native_recheck.py
      - name: Verify measurement completeness without adoption
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase132_native.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==6 and len(d["controls"])==8
          assert all(len(r["levels"])==3 and len(r["domains"])==2 for r in d["rows"])
          print("Measured",len(d["rows"]),"Passed",sum(r["passed"] for r in d["rows"]))
          PY
      - name: Recheck six additional frozen collars in Blender
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase143_native_recheck.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase143_native.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==6 and len(d["controls"])==8
          assert all(len(r["levels"])==3 and len(r["domains"])==6 for r in d["rows"])
          print("Measured",len(d["rows"]),"Passed",sum(r["passed"] for r in d["rows"]))
          PY
      - name: Compare built-in editing tools under paired intents
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase151_native_intent.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase151_native_intent.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==3 and all(len(r["options"])==7 for r in d["rows"])
          assert all(r["preserve"]==r["unknown"]=="keep" for r in d["rows"])
          PY
      - name: Sweep built-in smoothing parameters
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase152_native_sweep.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase152_native_sweep.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["cases"])==3 and all(len(c["rows"])==28 for c in d["cases"])
          PY
      - name: Acquire official LoopTools extension with manifest hash
        env:
          LOOPTOOLS_DIR: ${{ runner.temp }}/looptools154
          LOOPTOOLS_PROVENANCE: ${{ runner.temp }}/looptools154-provenance.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, os, urllib.request, urllib.parse, zipfile, io, pathlib, tomllib
          url='https://extensions.blender.org/api/v1/extensions/?blender_version=4.4.3'
          def fetch(u,limit):
              req=urllib.request.Request(u,headers={'User-Agent':'Blender/4.4.3'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=r.read(limit+1)
                  assert len(data)<=limit
                  return data
          index=json.loads(fetch(url,32*1024*1024))
          candidates=[x for x in index['data'] if x.get('name','').replace(' ','').lower()=='looptools' and x.get('version')=='4.7.7']
          assert len(candidates)==1,[(x.get('id'),x.get('version')) for x in index['data'] if 'looptool' in str(x.get('id','')).lower()]
          a=candidates[0]
          archive=urllib.parse.urljoin(url,a['archive_url'])
          assert urllib.parse.urlparse(archive).scheme=='https' and urllib.parse.urlparse(archive).hostname=='extensions.blender.org'
          blob=fetch(archive,2*1024*1024); digest=hashlib.sha256(blob).hexdigest()
          assert len(blob)==a['archive_size'] and a['archive_hash']=='sha256:'+digest
          assert digest=='ff1ca3b3fff73094379da8b1fa2c1acbc9d88d26b7dfc73bb9de5941a6b50108'
          dest=pathlib.Path(os.environ['LOOPTOOLS_DIR']);dest.mkdir(exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              entries=z.infolist()
              assert sum(x.file_size for x in entries)<8*1024*1024
              assert all(not pathlib.PurePosixPath(x.filename).is_absolute() and '..' not in pathlib.PurePosixPath(x.filename).parts and '\\' not in x.filename for x in entries)
              z.extractall(dest)
          manifests=list(dest.rglob('blender_manifest.toml'));assert len(manifests)==1
          manifest=tomllib.loads(manifests[0].read_text())
          assert manifest['version']=='4.7.7' and (manifests[0].parent/'__init__.py').is_file()
          provenance=dict(id=a['id'],version=a['version'],sha256=digest,archive_url=archive,manifest_root=str(manifests[0].parent))
          pathlib.Path(os.environ['LOOPTOOLS_PROVENANCE']).write_text(json.dumps(provenance))
          print(json.dumps(provenance))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('LOOPTOOLS_DIR='+str(manifests[0].parent)+'\n')
              f.write('LOOPTOOLS_PROVENANCE='+os.environ['LOOPTOOLS_PROVENANCE']+'\n')
          PY
      - name: Compare actual LoopTools with the surrogate
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase154_looptools.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase154_looptools.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==4 and all(len(r["records"])==29 for r in d["rows"])
          assert sum('error' in x for r in d["rows"] for x in r["records"])==0
          PY
      - name: Replay frozen LoopTools settings and audit native subdivision
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase156_looptools_subdiv.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase156_looptools_subdiv.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==4 and all(r["reproducible"] for r in d["rows"])
          assert sum(r["edited"] is not None for r in d["rows"])==3
          assert all(len(x["levels"])==3 for r in d["rows"] for x in (r["baseline"],r["edited"]) if x is not None)
          print("Selected passed",sum(r["selected_passed"] for r in d["rows"]),"/ 4")
          PY
      - name: Test bounded tool selection on calibrated fixtures
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase157_bounded_selector.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase157_bounded_selector.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"] and not d["independent_holdout"]
          assert len(d["rows"])==4 and d["controls"]==8
          assert all(r["evaluations"]<=3 and not r["unknown_plan"] for r in d["rows"])
          print("Selected passed",sum(r["selected"]["passed"] for r in d["rows"]),"/4")
          PY
      - name: Evaluate frozen selector on unused collar fixtures
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase158_selector_holdout.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase158_selector_holdout.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert not d["selector_tuned"] and not d["new_geometry_corpus"] and d["held_out_from_selector_calibration"]
          assert len(d["rows"])==9 and all(1<=r["evaluations"]<=3 and len(r["options"])==2 for r in d["rows"])
          print("Baseline passed",sum(r["baseline"]["passed"] for r in d["rows"]),"/9")
          print("Selected passed",sum(r["selected"]["passed"] for r in d["rows"]),"/9")
          PY
      - name: Compare explicit objective profiles on measured candidates
        run: |
          set -euo pipefail
          python phase159_objective_profiles.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase159_objective_profiles.json").read_text())
          assert d["complete"] and d["native_source"] and d["replay_only"] and not d["approved"]
          assert len(d["rows"])==9 and d["controls"]==11
          assert all(d["summary"][p]["edits"]==0 for p in ("unknown","preserve","sufficient"))
          assert d["summary"]["balanced"]["max_turn_increase"]<=2.000001
          assert d["summary"]["balanced"]["max_extent_increase"]<=.010001
          PY
      - name: Test native operation contracts on new fixtures
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase160_operation_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase160_operation_contracts.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==10 and all(r["passed"] for r in d["rows"])
          assert sum(r["selected"] is None for r in d["rows"])==2
          PY
      - name: Compare short native modifier sequences
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase161_operation_sequences.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase161_operation_sequences.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==2 and all(len(r["candidates"])==10 for r in d["rows"])
          assert all(len(c["stages"])==len(c["ops"])+1 for r in d["rows"] for c in r["candidates"])
          print("Selected",[(r["name"],r["selected"]) for r in d["rows"]])
          PY
      - name: Test bounded state-driven native operation selection
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase162_state_planner.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase162_state_planner.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==7
          assert all(r["final_clean"] and len(r["trace"])<=r["budget"] for r in d["rows"])
          print("Goals met",sum(r["status"]=="goal_met" for r in d["rows"]))
          PY
      - name: Test native Boolean hole contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase163_hole_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase163_hole_contracts.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==3 and all(len(r["records"])==6 for r in d["rows"])
          assert all(c["rollback_exact"] for r in d["rows"] for c in r["records"])
          print("Selected",[(r["target"]["name"],r["selected"]) for r in d["rows"]])
          PY
      - name: Test multiple-hole clearance and minimum wall contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase164_multi_hole_clearance.py
