          assert not d["selector_tuned"] and not d["new_geometry_corpus"] and d["held_out_from_selector_calibration"]
          assert len(d["rows"])==9 and all(1<=r["evaluations"]<=3 and len(r["options"])==2 for r in d["rows"])
          print("Baseline passed",sum(r["baseline"]["passed"] for r in d["rows"]),"/9")
          print("Selected passed",sum(r["selected"]["passed"] for r in d["rows"]),"/9")
          PY
      - name: Compare explicit objective profiles on measured candidates
        run: |
          set -euo pipefail
          python phase159_objective_profiles.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase159_objective_profiles.json").read_text())
          assert d["complete"] and d["native_source"] and d["replay_only"] and not d["approved"]
          assert len(d["rows"])==9 and d["controls"]==11
          assert all(d["summary"][p]["edits"]==0 for p in ("unknown","preserve","sufficient"))
          assert d["summary"]["balanced"]["max_turn_increase"]<=2.000001
          assert d["summary"]["balanced"]["max_extent_increase"]<=.010001
          PY
      - name: Test native operation contracts on new fixtures
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase160_operation_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase160_operation_contracts.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==10 and all(r["passed"] for r in d["rows"])
          assert sum(r["selected"] is None for r in d["rows"])==2
          PY
      - name: Compare short native modifier sequences
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase161_operation_sequences.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase161_operation_sequences.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==2 and all(len(r["candidates"])==10 for r in d["rows"])
          assert all(len(c["stages"])==len(c["ops"])+1 for r in d["rows"] for c in r["candidates"])
          print("Selected",[(r["name"],r["selected"]) for r in d["rows"]])
          PY
      - name: Test bounded state-driven native operation selection
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase162_state_planner.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase162_state_planner.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==7
          assert all(r["final_clean"] and len(r["trace"])<=r["budget"] for r in d["rows"])
          print("Goals met",sum(r["status"]=="goal_met" for r in d["rows"]))
          PY
      - name: Test native Boolean hole contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase163_hole_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/phase163_hole_contracts.json").read_text())
          assert d["complete"] and d["native_executed"] and not d["approved"]
          assert len(d["rows"])==3 and all(len(r["records"])==6 for r in d["rows"])
          assert all(c["rollback_exact"] for r in d["rows"] for c in r["records"])
          print("Selected",[(r["target"]["name"],r["selected"]) for r in d["rows"]])
          PY
      - name: Test multiple-hole clearance and minimum wall contracts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase164_multi_hole_clearance.py
