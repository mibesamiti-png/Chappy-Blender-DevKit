          assert len(d["rows"])==11 and all(r["matched"] and not r["persistent_edit"] for r in d["rows"])
          assert sum(r["status"]=="proposal_verified" for r in d["rows"])==7
          assert all(r["native"]["rollback_exact"] for r in d["rows"] if r["native"] is not None)
          PY
      - name: Verify local native bevel and protected faces
