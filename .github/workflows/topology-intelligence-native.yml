                  if fm is not None:selected.append(dict(case=name,vertices=fm[0],faces=fm[1]))
                  violations=[t for x in (fast,slow) for t in x['attempts'] if any(e in t.get('reason','') for e in ('angle bound contradicted','corner premise','not a four-corner grid'))]
                  rows.append(dict(case=name,params=c,blend=blend,reference=min(refs),same=same,premise_violations=len(violations),fast=fast,slow=slow))
