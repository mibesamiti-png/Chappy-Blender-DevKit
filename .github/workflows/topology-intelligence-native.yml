                          else:
                              V,F=collar(c,.58,.5,0);smooth=3
                          V,F,extra=patch(V,F,g,smooth,1,c)
                          a=assess(V,F,c)
                          req((a['vertices'],a['quads'])==((25,16) if arm=='direct' else (41,32)),'budget')
                          if arm=='direct':
                              row['corners']=direct_corner_check(V,F,c)
                              req(a['min_angle']<=bound+1e-4,'angle bound contradicted')
                          row.update(**a,**extra,status='valid')
                          row['joint_pass']=a['gate_angle15'] and a['p95_worst']<=1.1*ref
                          raw.append(dict(case=name,arm=arm,offset=offset,simple=simple,vertices=V,faces=F))
                      except Exception as exc:row.update(status='rejected',reason=str(exc))
                      trials.append(row)
              finally:remove(g)
              direct=[x for x in trials[:-1] if x.get('joint_pass',False)]
              fallback=trials[-1]
