                              pa,pt=prev
                              rate=float(np.quantile(np.linalg.norm(dt-pt,axis=1)/data['scale'],.95)/(a-pa))
                          prev=(a,dt)
                          flagged=ts['p05_stretch']<.25 or ts['p95_stretch']>2. or (rate is not None and rate>.10)
                          contact=None
                          if a in AUDIT:
                              x=summary(audit(o,data));y=summary(audit(new,data))
                              contact=dict(source=x,result=y,classification=state(x,y))
                          rows.append(dict(case=name,weight=spec[-1],angle=a,preserve_volume=enabled,source=ss,result=ts,p95_displacement=p95,step_rate=rate,flagged=flagged,contact=contact,source_unchanged=all_snapshot(o)==before))
                  for mod in mods:mod.use_deform_preserve_volume=False
                  set_pose(rig,data,POSES[0])
                  coverage.append(dict(case=name,status='accepted',weight=spec[-1],weight_range=wrange,selected=decision['selected'],source_unchanged=all_snapshot(o)==before))
              except Exception as e:failures.append(dict(case=name,reason=str(e)))
              finally:
                  if g is not None:remove(g)
          d=Path('ti49-results');d.mkdir(exist_ok=True)
          accepted=sum(x['status']=='accepted' for x in coverage)
          audit_rows=[r for r in rows if r['contact'] is not None]
          complete=len(coverage)==4 and not failures and len(rows)==82*accepted and len(audit_rows)==34*accepted and all(r['source_unchanged'] for r in rows) and all(r['source_unchanged'] for r in coverage)
          # Holdout is diagnostic only. Do not optimize thresholds using these results
          # and then count the same cases as independent validation.
          summaries=[]
          for enabled in (False,True):
              a=[r for r in rows if r['preserve_volume']==enabled]
              known=[r for r in a if r['contact'] is not None]
              missed=[dict(case=r['case'],angle=r['angle'],classification=r['contact']['classification']) for r in known if bad(r['contact']['result']) and not r['flagged']]
              risks=[dict(case=r['case'],angle=r['angle']) for r in known if r['contact']['classification']=='result_only']
              summaries.append(dict(preserve_volume=enabled,samples=len(a),audited=len(known),target_confusion=report(a),classifications=dict(Counter(r['contact']['classification'] for r in known)),missed=missed,result_only=risks,worst_p95=max((r['p95_displacement'] for r in a),default=None)))
          out=dict(approved=False,blender=bpy.app.version_string,complete=complete,accepted=accepted,coverage=coverage,summaries=summaries,rows=rows,failures=failures)
          (d/'results.json').write_text(json.dumps(out,indent=2))
          bpy.ops.wm.save_as_mainfile(filepath=str((d/'holdout_rigs.blend').resolve()))
          compact=[{k:v for k,v in x.items() if k!='route'} for x in coverage]
          print('TI49_SUMMARY',json.dumps(dict(complete=complete,accepted=accepted,coverage=compact,rows=len(rows),audit_rows=len(audit_rows),summaries=summaries,failures=failures)),flush=True)
          assert complete and accepted>0,'holdout execution incomplete'
          PY
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python "$RUNNER_TEMP/ti49.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ti49-frozen-holdout-${{ github.sha }}
          path: ti49-results/
          if-no-files-found: warn
          retention-days: 14
      # Phase49: 4/4 patches, 328 poses, 136 audits; strain missed 18/27
      # flagged targets. Do not use strain to omit collision tests.
      # Phase50 compares batched SAT with existing scalar nonincident detector.
      # Incident audit remains unchanged; this is numerical equivalence only.
      - name: Phase50 batch nonincident triangle SAT without strain-based pruning
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          cat > "$RUNNER_TEMP/ti50.py" <<'PY'
          from pathlib import Path
          import os,time
          root=Path(os.environ['RUNNER_TEMP'])
          exec((root/'ti49.py').read_text().split('\nbpy.ops.object.select_all(action=',1)[0])
          # Preserve the Phase44 nonincident SAT rule, including its tolerance and
          # coplanar axes. Batch independent pair calculations, never skip on strain.
          def batched_sat(A,B):
              ea=np.roll(A,-1,axis=1)-A;eb=np.roll(B,-1,axis=1)-B
              na=np.cross(ea[:,0],ea[:,1]);nb=np.cross(eb[:,0],eb[:,1])
              axes=np.concatenate((na[:,None,:],nb[:,None,:],
                  np.cross(ea[:,:,None,:],eb[:,None,:,:]).reshape(-1,9,3),
                  np.cross(na[:,None,:],ea),np.cross(nb[:,None,:],eb)),axis=1)
              norm=np.linalg.norm(axes,axis=2);valid=norm>=1e-12
              axes=axes/np.where(valid,norm,1.)[:,:,None]
              x=np.einsum('nai,nvi->nav',axes,A);y=np.einsum('nai,nvi->nav',axes,B)
              gap=np.maximum(x.min(axis=2)-y.max(axis=2),y.min(axis=2)-x.max(axis=2))
              return ~np.any(valid&(gap>EPS),axis=1)
          def fast_contacts(V,F,face_ids):
              F=np.asarray(F,int);V=np.asarray(V,float)
              req(np.isfinite(V).all(),'nonfinite evaluated vertices')
              T=V[F];lo=T.min(axis=1);hi=T.max(axis=1)
              area=np.linalg.norm(np.cross(T[:,1]-T[:,0],T[:,2]-T[:,0]),axis=1)*.5
              degenerate=np.where(area<1e-10)[0].tolist()
              pairs=[];candidates=[];excluded=0
              for i in range(len(F)):
                  j=np.where(np.all(lo[i]<=hi[i+1:]+EPS,axis=1)&np.all(lo[i+1:]<=hi[i]+EPS,axis=1))[0]+i+1
                  if len(j)==0:continue
                  mask=(np.asarray(face_ids)[j]==face_ids[i])|np.any(F[i][None,:,None]==F[j][:,None,:],axis=(1,2))
                  excluded+=int(mask.sum())
                  candidates.extend((i,int(k)) for k in j[~mask])
              for start in range(0,len(candidates),256):
                  ij=np.asarray(candidates[start:start+256],int)
                  mask=batched_sat(T[ij[:,0]],T[ij[:,1]])
                  pairs.extend(map(tuple,ij[mask].tolist()))
              face_pairs=sorted({tuple(sorted((int(face_ids[i]),int(face_ids[j])))) for i,j in pairs})
              return dict(triangles=len(F),tested=len(candidates),excluded_incident=excluded,degenerate=degenerate,contact_pairs=pairs,face_pairs=face_pairs)
          def compare(V,F,ids):
              # Alternate execution order to reduce systematic timing bias.
              t=time.perf_counter();a=contacts(V,F,ids);old=time.perf_counter()-t
              t=time.perf_counter();b=fast_contacts(V,F,ids);new=time.perf_counter()-t
              return a,b,old,new
          rng=np.random.default_rng(5001);controls=[]
          A=np.array([[0.,0,0],[1,0,0],[0,1,0]])
          base=[('cross',[[.2,.2,-.5],[.2,.2,.5],[.7,.2,0]],True),
                ('gap',[[0,0,.01],[1,0,.01],[0,1,.01]],False),
                ('coplanar',[[.1,.1,0],[.7,.1,0],[.1,.7,0]],True),
                ('disjoint',[[.8,.8,0],[1,.8,0],[.8,1,0]],False),
                ('point',[[1,0,0],[1.5,0,0],[1,.5,0]],True),
                ('edge',[[0,0,0],[1,0,0],[.5,-.5,0]],True)]
          for name,B,want in base:
              for k in range(20):
                  R,_=np.linalg.qr(rng.normal(size=(3,3)))
                  V=np.vstack((A,B))@R.T+rng.uniform(-.5,.5,3)
                  F=[tuple(rng.permutation((0,1,2))),tuple(rng.permutation((3,4,5)))]
                  a,b,_,_=compare(V,F,[0,1])
                  controls.append(dict(case=name,ok=a==b and bool(a['contact_pairs'])==want))
          # Additional random triangle soups, including incident and degenerate geometry.
          for k in range(40):
              V=rng.uniform(-1,1,(24,3));F=[tuple(rng.choice(24,3,replace=False)) for _ in range(16)]
              V[2]=(V[0]+V[1])/2;F.extend([(0,1,2),(0,1,3)])
              ids=list(range(len(F)));a,b,_,_=compare(V,F,ids)
              controls.append(dict(case='soup',ok=a==b))
          def eval_geometry(o,data):
              dep=bpy.context.evaluated_depsgraph_get();ev=o.evaluated_get(dep);m=ev.to_mesh()
              try:
                  m.calc_loop_triangles()
                  V=np.array([tuple(ev.matrix_world@v.co) for v in m.vertices],float)
                  V=(V-data['origin'])@data['Q']/data['scale']
                  return V,[tuple(t.vertices) for t in m.loop_triangles],[t.polygon_index for t in m.loop_triangles]
              finally:ev.to_mesh_clear()
          ref=json.loads(Path('ti49-results/results.json').read_text())
          req(ref['complete'] and ref['accepted']==4,'Phase49 integrity')
          anchors={(r['case'],r['angle'],r['preserve_volume']):r['contact'] for r in ref['rows'] if r['contact'] is not None}
          bpy.ops.object.select_all(action='SELECT');bpy.ops.object.delete(use_global=False)
          rows=[];failures=[]
          for spec in HOLDOUT:
              name=spec[0];o=fixture(*spec[:-1]);init_attributes(o);g=None
              try:
                  data=extract(o);new_weights(o,data,spec[-1]);before=all_snapshot(o)
                  g=prepare(data);decision,m=route(data,g);req(m is not None,'no candidate')
                  new,_=replace_attributes(o,data,*m)
                  rig=rig_for(data,name);attach(o,rig);attach(new,rig)
                  mods=[o.modifiers['TI43_Armature'],new.modifiers['TI43_Armature']]
                  for enabled in (False,True):
                      for mod in mods:mod.use_deform_preserve_volume=enabled
                      for angle in sorted(AUDIT):
                          set_pose(rig,data,('twist'+str(angle),(0,angle,0),(0,-angle,0),False))
                          anchor=anchors[name,angle,enabled]
                          for label,obj in [('source',o),('result',new)]:
                              V,F,ids=eval_geometry(obj,data)
                              a,b,old,newtime=compare(V,F,ids)
                              # Repeat with reverse timing order; use total times.
                              t=time.perf_counter();b2=fast_contacts(V,F,ids);newtime+=time.perf_counter()-t
                              t=time.perf_counter();a2=contacts(V,F,ids);old+=time.perf_counter()-t
                              expected=anchor[label]
                              rows.append(dict(case=name,angle=angle,preserve_volume=enabled,mesh=label,match=a==b==a2==b2,anchor_match=len(a['contact_pairs'])==expected['nonincident'] and len(a['degenerate'])==expected['degenerate'],triangles=len(F),candidates=a['tested'],contacts=len(a['contact_pairs']),old_seconds=old,new_seconds=newtime,source_unchanged=all_snapshot(o)==before))
                  for mod in mods:mod.use_deform_preserve_volume=False
                  set_pose(rig,data,POSES[0])
              except Exception as e:failures.append(dict(case=name,reason=str(e)))
              finally:
                  if g is not None:remove(g)
          d=Path('ti50-results');d.mkdir(exist_ok=True)
          complete=len(rows)==272 and not failures and len(controls)==160 and all(c['ok'] for c in controls) and all(r['match'] and r['anchor_match'] and r['source_unchanged'] for r in rows)
          timings={}
          for label in ('source','result','all'):
              a=[r for r in rows if label=='all' or r['mesh']==label]
              old=sum(r['old_seconds'] for r in a);new=sum(r['new_seconds'] for r in a)
              timings[label]=dict(samples=len(a),old_seconds=old,new_seconds=new,speedup=old/new if new else None,contacts=sum(r['contacts'] for r in a),candidates=sum(r['candidates'] for r in a))
          out=dict(approved=False,blender=bpy.app.version_string,complete=complete,controls_pass=sum(c['ok'] for c in controls),controls_total=len(controls),matches=sum(r['match'] for r in rows),anchors=sum(r['anchor_match'] for r in rows),timings=timings,failures=failures)
          (d/'results.json').write_text(json.dumps(dict(**out,rows=rows,controls=controls),indent=2))
          print('TI50_SUMMARY',json.dumps(out),flush=True)
          assert complete,'batched SAT equivalence failed'
          PY
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python "$RUNNER_TEMP/ti50.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ti50-batched-sat-${{ github.sha }}
          path: ti50-results/
          if-no-files-found: warn
          retention-days: 14
