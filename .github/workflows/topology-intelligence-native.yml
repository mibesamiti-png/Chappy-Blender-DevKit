      - name: Phase37 boundary-aware candidate routing
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          cat > "$RUNNER_TEMP/ti37.py" <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])
          exec((root/'ti35.py').read_text().split('\nrows=[];raw=[];selected=[]',1)[0])
          # Generalize only the evaluation domain and analytic area to convex XY boundaries.
          # All existing thresholds, both triangle diagonals, and geometry checks remain.
          src=(root/'ti32.py').read_text().split('def assess(',1)[1].split('\ndef fill(',1)[0]
          assert '8*np.sin(np.pi/8)' in src
          exec('def assess('+src.replace('8*np.sin(np.pi/8)','DOMAIN_AREA'))
          CIRCLE=B.copy()
          def set_domain(blend):
              global B,S,DOMAIN_AREA
              B=(1-blend)*CIRCLE+blend*SQUARE
              e=np.roll(B,-1,axis=0)-B
              DOMAIN_AREA=float(np.sum(B[:,0]*np.roll(B[:,1],-1)-B[:,1]*np.roll(B[:,0],-1))/2)
              req(DOMAIN_AREA>0,'boundary orientation')
              xx,yy=np.meshgrid(np.linspace(-.99,.99,201),np.linspace(-.99,.99,201))
              pts=np.column_stack((xx.ravel(),yy.ravel()))
              delta=pts[:,None,:]-B[None,:,:]
              S=pts[np.all(e[None,:,0]*delta[:,:,1]-e[None,:,1]*delta[:,:,0]>1e-8,axis=1)]
          def angle(a,b,c):
              u=a-b;v=c-b
              return float(np.degrees(np.arccos(np.clip(np.dot(u,v)/(np.linalg.norm(u)*np.linalg.norm(v)),-1,1))))
          def corner_bound(c):
              V=target(B,c).astype(np.float32).astype(float)
              q=[]
              for i,b in enumerate(V):
                  a,d=V[(i-1)%16],V[(i+1)%16]
                  q.append(min(angle(a,b,d),angle(b,a,d),angle(a,d,b)))
              return sorted(q,reverse=True)[3]
          def direct_corner_check(V,F,c):
              V=np.asarray(V)
              match=np.linalg.norm(V[:,None,:]-target(B,c)[None,:,:],axis=2).argmin(axis=0)
              req(len(set(match))==16,'corner mapping')
              corners=[]
              for i,v in enumerate(match):
                  incident=[f for f in F if int(v) in f]
                  if len(incident)==1:
                      req(int(match[(i-1)%16]) in incident[0] and int(match[(i+1)%16]) in incident[0],'corner premise')
                      corners.append(i)
              req(len(corners)==4,'not a four-corner grid')
              return corners
          # Seen cases are not fresh holdout; four new shapes test both sides of the decision.
          prior=json.loads(Path('ti36-results/results.json').read_text())
