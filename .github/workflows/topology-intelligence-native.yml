                  row,m=generate('collar',0,False)
                  if row.get('joint_pass',False):best,mesh=row,m
              return dict(bound=bound,skip=skip,attempts=attempts,selected=best,elapsed_seconds=time.perf_counter()-start),mesh
          def same_result(a,b,ma,mb):
              x,y=a['selected'],b['selected']
              if x is None or y is None:return x is None and y is None and ma is None and mb is None
              return (x['arm'],x['offset'],x['simple'])==(y['arm'],y['offset'],y['simple']) and abs(x['p95_worst']-y['p95_worst'])<1e-7 and abs(x['min_angle']-y['min_angle'])<1e-4 and ma[1]==mb[1] and np.allclose(ma[0],mb[0],rtol=0,atol=1e-7)
          rows=[];selected=[]
          for i,(name,c,blend) in enumerate(fixtures):
