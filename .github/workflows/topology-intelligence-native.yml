          out=dict(approved=False,blender=bpy.app.version_string,rows=rows,gate=gate,audit_attempts=len(rows)*17,hypothetical_attempts=sum(x['hypothetical_attempts'] for x in rows))
          (d/'results.json').write_text(json.dumps(out,indent=2));(d/'raw.json').write_text(json.dumps(raw))
