          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Measure generated cam under real motor contact and negative controls
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_native_contact.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_contact")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and r["frames"]==481
          assert [c["name"] for c in r["cases"]]==["engaged","separated","motor_off"]
          assert all(len(c["rows"])==481 for c in r["cases"])
          assert not any(r[k] for k in ("keyframed","whole_machine_certified","manufacturing_certified"))
          assert r["ideal_guides"] and r["gravity_return"]
          assert r["fixture_gate"]["certified"]==all(c["evaluation"]["status"]=="pass" for c in r["cases"])
          assert (p/"contact_cam.blend").stat().st_size>0
          print("Contact fixture gate:",r["fixture_gate"]["status"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase212-contact-${{ github.sha }}
          path: research/native_bevel_phase112/results/phase212_contact/
          if-no-files-found: warn
          retention-days: 14

