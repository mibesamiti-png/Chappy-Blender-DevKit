      - name: Diagnose Geneva stall with bounded candidates
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_geneva_contact_screen.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_geneva_k2")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and r["frames"]==961
          assert r["plan"]==[["relief40",40,40.],["relief45",45,40.],["impulse160",35,160.]]
          assert 1<=len(r["history"])<=r["budget"]==3
          assert not any(r[k] for k in ("sampled_lock_reverified","whole_design_certified","manufacturing_certified"))
          for i,h in enumerate(r["history"]):
              assert h["candidate"]==r["plan"][i][0]
              d=p/h["candidate"]
              c=json.loads((d/"engaged.json").read_text())
              assert len(c["rows"])==961 and c["evaluation"]==h["motion"]
              assert (c["relief_degrees"],c["impulse"])==tuple(r["plan"][i][1:])
              for n,v in h["controls"].items():
                  c=json.loads((d/(n+".json")).read_text())
                  assert len(c["rows"])==961 and c["evaluation"]==v
          if r["selected"]:
              h=r["history"][-1]
              assert h["candidate"]==r["selected"] and h["fixture_gate"]["certified"]
              assert set(h["controls"])=={"separated","motor_off"}
              assert r["action"]=="physical_fixture_pass_lock_recheck_required"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
