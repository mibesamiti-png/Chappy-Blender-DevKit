          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Validate swept relief and conditional passive drive
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_native_geneva_swept_trial.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_geneva_swept")
          r=json.loads((p/"report.json").read_text())
          g=json.loads((p/"geometry/report.json").read_text())
          d=g["dimensions"]
          assert r["complete"] and r["native_executed"] and r["frames"]==961
          assert len(g["rows"])==721 and len(g["lock_samples"])==540
          assert r["perturbed_count"]==len(g["perturbed_disk_rows"])==362
          assert d["profile_kind"]=="sampled_radial_sweep" and d["sweep_poses"]==543
          assert d["sweep_margin"]==.02 and d["error_degrees"]==.96
          assert len(d["radius_before"])==len(d["radius_after"])==360
          cuts=[a-b for a,b in zip(d["radius_before"],d["radius_after"])]
          assert min(cuts)>=-1e-12 and max(cuts)<.1
          assert d["changed_vertices"]==sum(c>1e-8 for c in cuts)>0
          assert not r["continuous_sweep_proven"] and not r["manufacturing_certified"]
          stages=r["stages"]
          assert (stages["geometry"]=="pass")==g["geometry_gate"]
          assert (stages["sampled_lock"]=="pass")==g["sampled_lock_gate"]
          assert (stages["perturbed_disk"]=="pass")==g["perturbed_disk_gate"]
          eligible=all(stages[k]=="pass" for k in ("geometry","sampled_lock","perturbed_disk"))
          assert bool(r["cases"])==eligible
          for c in r["cases"]:
              full=json.loads((p/"physical"/(c["name"]+".json")).read_text())
              assert len(full["rows"])==961 and c["evaluation"]==full["evaluation"]
              assert c["profile_factory"]=="swept_profiles" and c["impulse"]==40.
          if r["gate"]["certified"]:
              assert all(v=="pass" for v in stages.values())
              assert {c["name"] for c in r["cases"]}=={"engaged","separated","motor_off"}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase212-geneva-swept-${{ github.sha }}
          path: research/native_bevel_phase112/results/phase212_geneva_swept/
          if-no-files-found: warn
          retention-days: 14
