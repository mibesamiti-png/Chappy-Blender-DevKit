          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Execute bounded end-to-end design and verify evidence
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_native_engine_fixture.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_engine")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and not r["manufacturing_certified"]
          d=r["design"]
          assert d["budget"]==2 and len(d["history"])<=2
          assert r["calls"][0]==["compact","geometry"]
          assert d["history"][0]["qualification"]["status"]=="fail"
          assert all(c[0]!="compact" or c[1]=="geometry" for c in r["calls"])
          assert d["selected"]=="reference" and d["action"]=="validated_fixture"
          assert r["calls"]==[["compact","geometry"]]+[["reference",s] for s in ("geometry","screen","full_motion","negative_controls")]
          assert d["history"][1]["qualification"]["certified"]
          for n in ("engaged","separated","motor_off"):
              c=json.loads((p/"reference"/(n+".json")).read_text())
              assert c["name"]==n and len(c["rows"])==601 and c["evaluation"]["status"]=="pass"
          assert all((p/"reference"/n).stat().st_size>0 for n in ("kinematic_preview.blend","physical_cam_stack.blend"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase212-engine-${{ github.sha }}
          path: research/native_bevel_phase112/results/phase212_engine/
          if-no-files-found: warn
          retention-days: 14

