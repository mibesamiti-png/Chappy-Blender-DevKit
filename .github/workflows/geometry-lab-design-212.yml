name: Geometry Lab reusable design evaluation Phase 212
on:
  pull_request:
    paths:
      - 'research/native_bevel_phase112/phase212_*.py'
      - 'research/native_bevel_phase112/test_phase212_*.py'
      - '.github/workflows/geometry-lab-design-212.yml'
permissions:
  contents: read
concurrency:
  group: geometry-design-212-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  evaluation:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test backend-neutral evidence and stopping rules
        run: python -m unittest discover -v -p 'test_phase212_*.py'

  native-cam-part:
    if: github.head_ref == 'research/native-bevel-phase112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/native_bevel_phase112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile research sources
        run: python -m compileall -q .
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender.tar.xz
          key: geometry-lab-blender-4.4.3-linux-x64-8d3be07d2bc412b5
      - name: Acquire and verify pinned Blender archive
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/blender.tar.xz" ]; then
            curl --fail --location --retry 3 --max-time 400 "https://download.blender.org/release/Blender4.4/blender-4.4.3-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          fi
          echo "8d3be07d2bc412b502c6bfe3cfe3e22195a4164076867da987ce148d73c27946  $RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Generate and independently verify native 3D cam parts
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_native_cam_fixture.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_cam_part")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and r["gate"]
          assert len(r["parts"])==2 and all(q["status"]=="pass" and all(q["checks"].values()) for q in r["parts"])
          assert all(r["controls"].values())
          assert not any(r[k] for k in ("physical_contact_certified","assembly_certified","manufacturing_certified"))
          assert all((p/n).stat().st_size>0 for n in ("cam_parts.blend","stride.obj","dwell.obj"))
          PY
      - name: Verify native coaxial cam assembly and keyframe playback
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python phase212_native_assembly_fixture.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/phase212_cam_assembly")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and r["gate"] and r["replay_pass"]
          assert len(r["objects"])==5 and r["assembly"]["samples"]==241
          assert r["assembly"]["evaluation"]["status"]=="pass"
          assert len(r["assembly"]["evaluation"]["metrics"])==21
          assert all(r["controls"].values()) and r["ideal_shared_rotation"]
          assert not any(r[k] for k in ("physical_motion_certified","torque_transfer_certified","manufacturing_certified"))
          assert (p/"cam_stack.blend").stat().st_size>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase212-cam-parts-${{ github.sha }}
          path: research/native_bevel_phase112/results/phase212_cam_part/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase212-cam-assembly-${{ github.sha }}
          path: research/native_bevel_phase112/results/phase212_cam_assembly/
          if-no-files-found: warn
          retention-days: 14

