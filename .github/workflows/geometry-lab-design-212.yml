          p=Path("results/phase212_shared_drive")
          r=json.loads((p/"report.json").read_text())
          assert r["complete"] and r["native_executed"] and r["frames"]==601
          assert (r["cam_count"],r["active_bodies"],r["motor_count"])==(2,3,1)
          assert [c["name"] for c in r["cases"]]==["engaged","separated","motor_off"]
          assert all(len(c["rows"])==601 and len(c["outputs"])==2 for c in r["cases"])
          assert all(c["kinematic_status"]=="pass" for c in r["cases"])
          assert r["ideal_rigid_camshaft"] and r["ideal_guides"] and r["gravity_return"]
          assert not any(r[k] for k in ("keyframed","torque_transfer_certified","manufacturing_certified"))
          assert r["fixture_gate"]["certified"]==all(c["evaluation"]["status"]=="pass" for c in r["cases"])
          assert (p/"physical_cam_stack.blend").stat().st_size>0
          print("Shared drive fixture gate:",r["fixture_gate"]["status"])
