name: Geometry Lab independent research validation
on:
  pull_request:
    paths:
      - 'research/geometry_lab/**'
      - '.github/workflows/geometry-lab.yml'
permissions:
  contents: read
concurrency:
  group: geometry-lab-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-oracle:
    if: startsWith(github.head_ref, 'research/geometry-lab-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/geometry_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-oracle.txt
      - run: python -m unittest discover -s tests -v
      # Import failure/timeout/mismatch is a failure, never an oracle "skip".
      - run: timeout 300 python -m cycles.r2.benchmark --output runs/ci-r2.json
      - run: timeout 300 python -m cycles.r3.benchmark --output runs/ci-r3.json
      - run: timeout 120 python -m cycles.r4.python_run --output runs/ci-r4.json
      - run: timeout 180 python -m cycles.r5.run --output runs/ci-r5.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-lab-r2-r3-r4-r5-${{ github.sha }}
          path: |
            research/geometry_lab/runs/ci-r2.json
            research/geometry_lab/runs/ci-r3.json
            research/geometry_lab/runs/ci-r4.json
            research/geometry_lab/runs/ci-r5.json
          if-no-files-found: error
          retention-days: 14

  r6-native-bridge:
    if: startsWith(github.head_ref, 'research/geometry-lab-')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: research/geometry_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent CGAL evaluation
        run: python -m pip install -r requirements-oracle.txt
      - name: Download verified official Blender 4.4.3
        shell: bash
        run: |
          set -euo pipefail
          base="https://download.blender.org/release/Blender4.4"
          curl --fail --location --retry 3 --max-time 300 "$base/blender-4.4.3.sha256" --output "$RUNNER_TEMP/blender.sha256"
          curl --fail --location --retry 3 --max-time 400 "$base/blender-4.4.3-linux-x64.tar.xz" --output "$RUNNER_TEMP/blender.tar.xz"
          python - "$RUNNER_TEMP/blender.sha256" "$RUNNER_TEMP/blender.tar.xz" <<'PY'
          import pathlib, re, sys, hashlib
          official = pathlib.Path(sys.argv[1]).read_text()
          lines = [line for line in official.splitlines() if 'blender-4.4.3-linux-x64.tar.xz' in line]
          if len(lines) != 1:
              raise SystemExit('missing or multiple official SHA256 entries')
          hashes = re.findall(r'\b[0-9a-fA-F]{64}\b', lines[0])
          if len(hashes) != 1:
              raise SystemExit('invalid official SHA256 format')
          actual = hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()
          if actual.lower() != hashes[0].lower():
              raise SystemExit('Blender official SHA256 mismatch')
          print('VERIFIED_BLENDER_SHA256', actual)
          PY
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
      - name: Generate Blender GUI-equivalent operator and R5 synthetic meshes
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-4.4.3-linux-x64/blender" --background --factory-startup --disable-autoexec --python-exit-code 1 --python cycles/r6/blender_run.py -- --output runs/ci-r6-raw.json
      - name: Independently evaluate all R6 meshes with CGAL
        run: timeout 360 python -m cycles.r6.evaluate --input runs/ci-r6-raw.json --output runs/ci-r6-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-lab-r6-${{ github.sha }}
          path: |
            research/geometry_lab/runs/ci-r6-raw.json
            research/geometry_lab/runs/ci-r6-eval.json
          if-no-files-found: warn
          retention-days: 14

  r7-nonplanar-bridge:
    if: startsWith(github.head_ref, 'research/geometry-lab-')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
