[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chappy-blender-devkit"
version = "0.12.0"
description = "Static Blender addon inventory, API auditing and review-only dependency bundling"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary / license to be selected by repository owner" }

[project.scripts]
cbdk = "cbdk.__main__:main"

[tool.setuptools]
packages = ["cbdk", "parts", "parts.common", "parts.blender"]
